media: assets

content:
  - name: home
    label: Homepage
    type: file
    path: content/home.json
    fields:
      - { name: headline, label: Headline, type: string }
      - { name: bio, label: Bio paragraphs, type: string, list: true }
      - name: links
        label: Buttons
        type: object
        list: true
        fields:
          - { name: label, label: Button label, type: string }
          - { name: url, label: Links to, type: string }