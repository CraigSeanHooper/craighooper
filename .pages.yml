media:
  - name: assets
    label: Assets
    input: assets
    output: /assets
  - name: hero-grid-images
    label: Hero Grid Images
    input: lab/hero-grid/assets/images
    output: /lab/hero-grid/assets/images
    categories: [image]
  - name: photo-gallery-photos
    label: Photo Gallery Photos
    input: lab/photo-gallery/assets/photos
    output: /lab/photo-gallery/assets/photos

content:
  - name: home
    label: Homepage
    type: file
    path: content/home.json
    fields:
      - { name: headline, label: Headline, type: text, description: "Press Enter where you want the line to break." }
      - { name: bio, label: Bio Paragraphs, type: text, list: true }
      - { name: email, label: Email Address, type: string }
      - name: social
        label: Social Links
        type: object
        fields:
          - { name: twitter, label: Twitter, type: string }
          - { name: instagram, label: Instagram, type: string }

  - name: hero-grid
    label: Lab — Hero Grid
    type: file
    path: content/hero-grid.json
    fields:
      - name: headline
        label: Headline
        type: text
      - name: photos
        label: Photos
        type: object
        list: true
        fields:
          - name: src
            label: Image
            type: image
            options:
              media: hero-grid-images
          - name: alt
            label: Alt Text
            type: string

  - name: photo-gallery-page
    label: Lab — Photo Gallery Page Text
    type: file
    path: lab/photo-gallery/content/page.json
    fields:
      - name: heading
        label: Heading
        type: string
      - name: intro
        label: Intro paragraph
        type: text

  - name: photo-gallery-photos
    label: Lab — Photo Gallery Photos
    type: collection
    path: lab/photo-gallery/content/photos
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [title, year, order]
      sort: [order, title, year]
    fields:
      - name: title
        label: Title
        type: string
      - name: image
        label: Photo
        type: image
        options:
          media: photo-gallery-photos
      - name: alt
        label: Alt text
        type: text
        description: What's in the frame, for screen readers. Not shown on the page.
      - name: caption
        label: Caption
        type: text
      - name: year
        label: Year
        type: string
      - name: order
        label: Order
        type: number
        description: Lower numbers appear first in the grid.
