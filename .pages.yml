media:
  - name: assets
    label: Assets
    input: assets
    output: /assets
  - name: hero-grid-images
    label: Hero Grid Images
    input: lab/hero-grid/assets/images
    output: /lab/hero-grid/assets/images
    categories: [image]

content:
  - name: home
    label: Homepage
    type: file
    path: content/home.json
    fields:
      - name: pill
        label: Availability Pill
        type: object
        fields:
          - { name: show, label: Show the pill, type: boolean, default: true }
          - { name: status, label: Status, type: select, options: { values: [Available, Not available] }, default: Available }
          - { name: text, label: Pill Text, type: string }
      - { name: headline, label: Headline, type: text, description: "Press Enter where you want the line to break." }
      - { name: bio, label: Bio Paragraphs, type: text, list: true }
      - { name: email, label: Email Address, type: string }
      - name: social
        label: Social Links
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: url, label: Links To, type: string }

  - name: hero-grid
    label: Lab — Hero Grid
    type: file
    path: content/hero-grid.json
    fields:
      - name: headline
        label: Headline
        type: text
      - name: photos
        label: Photos
        type: object
        list: true
        fields:
          - name: src
            label: Image
            type: image
            options:
              media: hero-grid-images
          - name: alt
            label: Alt Text
            type: string
