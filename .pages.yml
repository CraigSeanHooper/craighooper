media:
  - name: assets
    label: Assets
    input: assets
    output: /assets
  - name: hero-grid-images
    label: Hero Grid Images
    input: lab/hero-grid/assets/images
    output: /lab/hero-grid/assets/images
    categories: [image]

content:
  - name: home
    label: Homepage
    type: file
    path: content/home.json
    fields:
      - { name: headline, label: Headline, type: string }
      - { name: bio, label: Bio Paragraphs, type: text, list: true }
      - { name: email, label: Email Address, type: string }
      - name: work
        label: Work History
        type: object
        list: true
        fields:
          - { name: dates, label: Dates, type: string }
          - { name: name, label: Company, type: string }
          - { name: url, label: Links To, type: string }
          - { name: role, label: Role, type: string }
      - name: social
        label: Social Links
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: url, label: Links To, type: string }

  - name: hero-grid
    label: Lab — Hero Grid
    type: file
    path: content/hero-grid.json
    fields:
      - name: headline
        label: Headline
        type: text
      - name: photos
        label: Photos
        type: object
        list: true
        fields:
          - name: src
            label: Image
            type: image
            options:
              media: hero-grid-images
          - name: alt
            label: Alt Text
            type: string
