<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a1a">
  <title>Page not found — Craig Hooper</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .notfound {
      position: relative;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background-image: url("/assets/bg-404-desktop.jpg");
      background-size: cover;
      background-position: center;
    }
    /* size comes from the .h3 text style; only the colour is local */
    .notfound h1 {
      margin: 0;
      color: var(--text-inverse);
      text-align: center;
      white-space: nowrap;
    }
    @media (max-width: 820px) {
      .notfound { background-image: url("/assets/bg-404-mobile.jpg"); }
    }
    .notfound a { color: inherit; text-decoration: none; }
    .notfound a:hover { text-decoration-line: underline; text-decoration-thickness: 8%; text-underline-offset: 16%; }
    .notfound a:focus-visible { outline: 2px solid var(--text-inverse); outline-offset: 6px; }
  </style>
</head>
<body>
  <main class="notfound">
    <h1 class="h3"><a href="/">Go home</a></h1>
  </main>
</body>
</html>
