<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Home — Craig Hooper</title>
  <style>
    @font-face {
      font-family: "Marlin Soft SQ";
      src: url("/assets/fonts/MarlinSoftSQ-ExtraBlack.woff2") format("woff2");
      font-weight: 950;
      font-style: normal;
      font-display: swap;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      /* dark fallback if the image is missing */
      background: #14130f center / cover no-repeat;
      background-image: url("/assets/404-bg.jpg");
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .lost {
      margin: 0;
      font-family: "Marlin Soft SQ", "Arial Black", "Helvetica Neue", sans-serif;
      font-weight: 950;
      font-size: 48px;
      line-height: 46px;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      text-align: center;
      color: #ffffff;
      text-decoration: none;
      font-feature-settings: "salt" 1;
      filter: blur(0.5px); /* matches the homepage h1 blur */
    }

    @media (max-width: 600px) {
      body { background-image: url("/assets/404-bg-mobile.jpg"); }
    }
  </style>
</head>
<body>
  <a class="lost" href="/">Home</a>
</body>
</html>
