<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Home — Craig Hooper</title>
  <style>
    @font-face {
      font-family: "KMR Melange Grotesk";
      src: url("/assets/fonts/KMRMelangeGrotesk-ExtraBold.woff2") format("woff2");
      font-weight: 800;
      font-style: normal;
      font-display: swap;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #14130f;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      pointer-events: none;
    }

    .lost {
      position: relative;
      margin: 0;
      padding: 0 24px;
      font-family: "KMR Melange Grotesk", "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 48px;
      line-height: 48px;
      letter-spacing: -0.01em;
      text-align: center;
      color: #ffffff;
      text-decoration: none;
      text-transform: none;
      font-feature-settings: "salt" 1, "ss08" 1;
    }

    @media (max-width: 600px) {
      .lost { font-size: 32px; line-height: 32px; }
    }
  </style>
</head>
<body>
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="/assets/404.mp4" type="video/mp4" />
  </video>
  <a class="lost" href="/">Go home and go to bed</a>
</body>
</html>
