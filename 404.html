<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Home — Craig Hooper</title>
  <style>
    @font-face {
      font-family: "FT System";
      src: url("/assets/fonts/FTSystem-BlankBold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #14130f center / cover no-repeat;
      background-image: url("/assets/404-bg.jpg");
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .lost {
      margin: 0;
      font-family: "FT System", "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      font-size: 48px;
      line-height: 48px;
      letter-spacing: -0.02em;
      text-align: center;
      color: #ffffff;
      text-decoration: none;
      text-transform: uppercase;
      font-feature-settings: "salt" 1;
    }

    @media (max-width: 600px) {
      body { background-image: url("/assets/404-bg-mobile.jpg"); }
      .lost { font-size: 32px; line-height: 34px; }
    }
  </style>
</head>
<body>
  <a class="lost" href="/">Go home</a>
</body>
</html>
