backend:
  name: github
  repo: CraigSeanHooper/craighooper
  branch: main

media_folder: assets
public_folder: /assets

collections:
  - name: pages
    label: Pages
    files:
      - name: home
        label: Homepage
        file: content/home.json
        fields:
          - { name: headline, label: Headline, widget: string }
          - name: bio
            label: Bio paragraphs
            widget: list
            field: { name: text, label: Paragraph, widget: text }
          - name: links
            label: Buttons
            widget: list
            fields:
              - { name: label, label: Button label, widget: string }
              - { name: url, label: Links to, widget: string }
