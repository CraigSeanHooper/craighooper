<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#efe9dd">
  <title>Page not found — Craig Hooper</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100dvh;
      background: #efe9dd;
    }
    .go-home {
      display: block;
      position: fixed;
      inset: 0;
      background-image: url("assets/bg-404-desktop.jpg");
      background-size: cover;
      background-position: center;
    }
    .go-home:focus-visible {
      outline: 3px solid #1a1a1a;
      outline-offset: -6px;
    }
    @media (max-width: 600px) {
      .go-home { background-image: url("assets/bg-404-mobile.jpg"); }
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0, 0, 0, 0); border: 0;
    }
  </style>
</head>
<body>
  <a class="go-home" href="/" aria-label="Go home"><span class="sr-only">Go home</span></a>
</body>
</html>
