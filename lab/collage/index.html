<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Lab - Photo Effects</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
  <style>
    @font-face { font-family: "KMR Melange Grotesk"; src: url("/assets/fonts/KMRMelangeGrotesk-Book.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Parabole"; src: url("/assets/fonts/Parabole-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "KMR Melange Grotesk"; src: url("/assets/fonts/KMRMelangeGrotesk-Medium.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }

    /* Look and feel referenced from base-ui.com; not yet in Foundations. */
    :root {
      --ui-page:     #ffffff;
      --ui-subtle:   #f9f9f9;
      --ui-control:  #f3f3f3;
      --ui-hover:    #ececec;
      --ui-border:   #e2e2e2;
      --ui-border-strong: #c9c9c9;
      --ui-text:     #2e2e2e;
      --ui-muted:    #767676;
      --ui-primary:  #2e2e2e;
      --ui-on-primary: #ffffff;
      --ui-focus:    oklch(0.55 0.2 264);
      --ui-slider:   #6e6e6e;
      --colour-accent-yellow: #fffbc6;   /* Foundations: --surface-accent */
      --colour-neutral-90: #1a1a1a;      /* Foundations: --text-on-accent */

      --space-50: 4px; --space-100: 8px; --space-150: 12px; --space-200: 16px; --space-300: 24px; --space-400: 32px; --space-500: 40px;
      --radius: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ui-page:     #111111;
        --ui-subtle:   #181818;
        --ui-control:  #1f1f1f;
        --ui-hover:    #262626;
        --ui-border:   #2e2e2e;
        --ui-border-strong: #454545;
        --ui-text:     #ececec;
        --ui-muted:    #8e8e8e;
        --ui-primary:  #ececec;
        --ui-on-primary: #111111;
        --ui-focus:    oklch(0.72 0.15 264);
        --ui-slider:   #a8a8a8;
      }
      .avatar img { filter: invert(1); }
    }

    * { box-sizing: border-box; }
    html { color-scheme: light dark; background: var(--ui-page); }
    body {
      margin: 0; height: 100vh; height: 100dvh;
      background: var(--ui-page); color: var(--ui-text);
      font-family: "KMR Melange Grotesk", "Helvetica Neue", Arial, sans-serif;
      font-weight: 400; font-synthesis: none;
      font-feature-settings: "ss08" 1;
      font-size: 14px; line-height: 22px;
      -webkit-font-smoothing: antialiased;
    }
    button, input, output { font: inherit; font-feature-settings: inherit; color: inherit; }
    .mono { font-variant-numeric: tabular-nums; }

    /* ---------- squircle shapes ----------
       .sq elements get smoothed corners from effects.js, which writes the
       outline (--sq-outer) and a 1px-smaller copy (--sq-inner) as clip paths.
       The element's own background is the border colour; ::before is the fill.
       Before the script runs, plain rounded corners stand in. */
    .sq {
      --r: var(--radius);
      --sq-line: var(--ui-border);
      --sq-fill: var(--ui-page);
      position: relative; isolation: isolate; border: 0;
      background: var(--sq-line);
      clip-path: var(--sq-outer, inset(0 round var(--r)));
    }
    .sq::before {
      content: ""; position: absolute; inset: 1px; z-index: -1; pointer-events: none;
      background: var(--sq-fill);
      clip-path: var(--sq-inner, inset(0 round calc(var(--r) - 1px)));
    }
    .sq:focus-visible { outline: none; --sq-line: var(--ui-focus); }

    .app { display: grid; grid-template-columns: 380px 1fr; grid-template-rows: 56px 1fr; height: 100%; }

    /* ---------- header ---------- */
    .header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-300); }
    .avatar { display: block; width: 40px; height: 40px; border-radius: 50%; }
    .avatar img { display: block; width: 40px; height: 40px; }
    .avatar:focus-visible { outline: 2px solid var(--ui-focus); outline-offset: 3px; }

    /* ---------- sidebar: sections separated by space, not lines ---------- */
    .panel { display: flex; flex-direction: column; min-height: 0; }
    .panel-body { flex: 1; overflow-y: auto; padding: var(--space-200) var(--space-300) var(--space-300); }
    .section + .section { margin-top: var(--space-500); }
    .heading { color: var(--ui-muted); margin: 0 0 var(--space-150); font-size: 14px; line-height: 22px; font-weight: 400; }

    .field + .field { margin-top: var(--space-200); }
    .field-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .field-head output { color: var(--ui-muted); font-variant-numeric: tabular-nums; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-150); }
    .stack > * + * { margin-top: var(--space-200); }


    /* buttons */
    .btn {
      --sq-fill: var(--ui-subtle);
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-100);
      height: 40px; padding: 0 var(--space-200); cursor: pointer; white-space: nowrap;
      font-family: "Parabole", "Helvetica Neue", Arial, sans-serif; font-feature-settings: "salt" 1, "ss08" 1;
    }
    .btn:hover { --sq-fill: var(--ui-control); }
    .btn:active { --sq-fill: var(--ui-hover); }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .btn-lg { height: 40px; padding: 0 var(--space-200); }
    .btn-primary { --sq-line: var(--colour-accent-yellow); --sq-fill: var(--colour-accent-yellow); color: var(--colour-neutral-90); }
    .btn-primary:hover { --sq-fill: var(--colour-accent-yellow); filter: brightness(0.97); }
    .btn-primary:disabled { opacity: 0.6; }
    .btn-primary:focus-visible { --sq-line: var(--ui-focus); }

    /* choices (colour mode, texture colour, format): plain text, the selected one underlined */
    .tabs { display: flex; gap: var(--space-300); }
    .tabs button {
      height: 32px; padding: 0; border: 0; background: none; cursor: pointer; color: var(--ui-muted);
      text-decoration: underline; text-decoration-color: transparent; text-decoration-thickness: 1px; text-underline-offset: 6px;
    }
    .tabs button:hover { color: var(--ui-text); }
    .tabs button[aria-pressed="true"] { color: var(--ui-text); text-decoration-color: currentColor; }
    .tabs button:focus-visible { outline: 2px solid var(--ui-focus); outline-offset: 2px; border-radius: 4px; }

    /* slider: thin track, filled to the value, round thumb */
    input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 20px; margin: 0; background: none; cursor: pointer;
      --p: 50%;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 1px;
      background: linear-gradient(to right, var(--ui-slider) var(--p), var(--ui-border) var(--p));
    }
    input[type="range"]::-moz-range-track { height: 1px; background: var(--ui-border); }
    input[type="range"]::-moz-range-progress { height: 1px; background: var(--ui-slider); }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; margin-top: -7.5px; border-radius: 50%;
      background: #fff; border: 1px solid var(--ui-border-strong);
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px; height: 16px; border-radius: 50%; background: #fff;
      border: 1px solid var(--ui-border-strong); box-shadow: none;
    }
    input[type="range"]:focus-visible { outline: none; }
    input[type="range"]:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--ui-focus); outline-offset: 2px; }
    input[type="range"]:disabled { opacity: 0.4; cursor: default; }

    /* colour presets: the chips are clipped to the inner shape, so the line shows round them */
    .presets { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--space-100); }
    .preset { height: 32px; padding: 0; cursor: pointer; }
    .preset::before { display: none; }
    .preset .chips { position: absolute; inset: 1px; display: flex; clip-path: var(--sq-inner, inset(0 round calc(var(--r) - 1px))); }
    .preset .chips i { flex: 1; }
    .preset:hover { --sq-line: var(--ui-text); }

    /* colour fields: swatch inside a text input */
    .colour-fields { display: grid; gap: var(--space-100); }
    .colour-field { display: grid; grid-template-columns: 1fr 150px; align-items: center; gap: var(--space-150); }
    .colour-field[hidden] { display: none; }
    .input { display: flex; align-items: center; gap: var(--space-100); height: 32px; padding: 0 var(--space-100) 0 5px; }
    .input:focus-within { --sq-line: var(--ui-focus); }
    .input input[type="text"] { flex: 1; min-width: 0; border: 0; background: none; outline: none; text-transform: uppercase; }
    input[type="color"] {
      --r: 5px;
      width: 22px; height: 22px; padding: 0; border: 0; background: none; cursor: pointer; flex: none;
      clip-path: var(--sq-outer, inset(0 round 5px));
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 0; }
    input[type="color"]::-moz-color-swatch { border: 0; border-radius: 0; }
    .colours[data-off="true"] { opacity: 0.4; pointer-events: none; }

    .panel-foot { display: grid; padding: var(--space-200) var(--space-300) var(--space-300); }

    /* ---------- stage ---------- */
    .stage {
      position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--ui-page);
      display: grid; place-items: center; padding: 24px 56px 56px 32px;
    }
    .stage.drop #choose-3 { --sq-line: var(--ui-focus); }
    #preview { display: block; touch-action: none; user-select: none; }
    #preview[hidden] { display: none; }
    .empty { display: grid; justify-items: center; gap: var(--space-200); text-align: center; color: var(--ui-muted); }
    .empty .btn { width: 332px; max-width: 100%; }   /* same width as the sidebar buttons */
    .empty[hidden] { display: none; }
    .status { position: absolute; left: 0; right: 0; bottom: var(--space-200); text-align: center; color: var(--ui-muted); font-size: 12px; }

    @media (max-width: 819px) {
      body { height: auto; }
      .app { display: flex; flex-direction: column; height: auto; }
      .header { height: 56px; padding: 0 var(--space-200); }
      .stage { display: block; padding: 0 var(--space-200); order: 1; }
      .empty { padding: 48px 0; }
      .status { position: static; margin-top: var(--space-100); }
      .panel { order: 2; }
      .panel-foot { order: -1; padding: var(--space-300) var(--space-200) 0; }
      .panel-body { overflow: visible; padding: var(--space-500) var(--space-200) var(--space-400); }
      .colour-field { grid-template-columns: 1fr 140px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <a class="avatar" href="/" aria-label="Craig Hooper, home"><img src="/assets/avatar.png" alt="" width="40" height="40" /></a>
    </header>

    <aside class="panel" aria-label="Controls">
      <div class="panel-body">
        <section class="section">
          <button type="button" class="btn btn-primary btn-lg sq" id="choose" style="width: 100%">Choose photo</button>
        </section>

        <section class="section stack">
          <h2 class="heading">Colour</h2>
          <div class="tabs" id="mode">
            <button type="button" data-value="original">Original</button>
            <button type="button" data-value="duo">Duotone</button>
            <button type="button" data-value="tri">Tritone</button>
          </div>
          <div class="colours stack" id="colours">
            <div class="presets" id="presets"></div>
            <div class="colour-fields">
              <label class="colour-field">
                <span>Shadows</span>
                <span class="input sq"><input type="color" id="c-dark" aria-label="Shadow colour" /><input type="text" class="mono" id="c-dark-hex" maxlength="7" aria-label="Shadow colour hex" /></span>
              </label>
              <label class="colour-field" id="mid-row">
                <span>Midtones</span>
                <span class="input sq"><input type="color" id="c-mid" aria-label="Midtone colour" /><input type="text" class="mono" id="c-mid-hex" maxlength="7" aria-label="Midtone colour hex" /></span>
              </label>
              <label class="colour-field">
                <span>Highlights</span>
                <span class="input sq"><input type="color" id="c-light" aria-label="Highlight colour" /><input type="text" class="mono" id="c-light-hex" maxlength="7" aria-label="Highlight colour hex" /></span>
              </label>
            </div>
            <button type="button" class="btn sq" id="swap" style="width: 100%">Swap shadows and highlights</button>
            <div class="field">
              <div class="field-head"><label for="amount">Strength</label><output class="mono" id="amount-value"></output></div>
              <input type="range" id="amount" min="0" max="100" />
            </div>
          </div>
        </section>

        <section class="section">
          <h2 class="heading">Adjust</h2>
          <div class="field">
            <div class="field-head"><label for="brightness">Brightness</label><output class="mono" id="brightness-value"></output></div>
            <input type="range" id="brightness" min="-100" max="100" />
          </div>
          <div class="field">
            <div class="field-head"><label for="contrast">Contrast</label><output class="mono" id="contrast-value"></output></div>
            <input type="range" id="contrast" min="-100" max="100" />
          </div>
          <div class="field">
            <div class="field-head"><label for="midtones">Midtones</label><output class="mono" id="midtones-value"></output></div>
            <input type="range" id="midtones" min="-100" max="100" />
          </div>
        </section>

        <section class="section">
          <h2 class="heading">Texture</h2>
          <div class="field">
            <div class="field-head"><label for="grain">Grain</label><output class="mono" id="grain-value"></output></div>
            <input type="range" id="grain" min="0" max="100" />
          </div>
          <div class="field">
            <div class="field-head"><label for="grainSize">Grain size</label><output class="mono" id="grainSize-value"></output></div>
            <input type="range" id="grainSize" min="1" max="6" />
          </div>
          <div class="field">
            <div class="field-head"><label for="speckle">Speckle</label><output class="mono" id="speckle-value"></output></div>
            <input type="range" id="speckle" min="0" max="100" />
          </div>
          <div class="field row">
            <span>Texture colour</span>
            <div class="tabs" id="ink">
              <button type="button" data-value="dark">Dark</button>
              <button type="button" data-value="light">Light</button>
            </div>
          </div>
          <div class="field">
            <button type="button" class="btn sq" id="reseed" style="width: 100%">New texture pattern</button>
          </div>
        </section>

        <section class="section">
          <h2 class="heading">Export</h2>
          <div class="field row">
            <span>Format</span>
            <div class="tabs" id="format">
              <button type="button" data-value="jpg">JPG</button>
              <button type="button" data-value="png">PNG</button>
            </div>
          </div>
          <div class="field">
            <div class="field-head"><label for="quality">JPG quality</label><output class="mono" id="quality-value"></output></div>
            <input type="range" id="quality" min="40" max="100" />
          </div>
          <div class="field">
            <button type="button" class="btn sq" id="reset" style="width: 100%">Reset all settings</button>
          </div>
        </section>
      </div>

      <div class="panel-foot">
        <button type="button" class="btn btn-primary btn-lg sq" id="download" style="width: 100%" disabled>Download</button>
      </div>
    </aside>

    <main class="stage" id="stage">
      <div class="empty" id="empty">
        <span>Drop a photo here, or paste one</span>
        <button type="button" class="btn btn-primary btn-lg sq" id="choose-3">Choose photo</button>
      </div>
      <canvas id="preview" hidden aria-label="Edited photo"></canvas>
      <div class="status mono" id="status" role="status"></div>
    </main>
  </div>
  <input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,image/*" hidden />
  <script src="effects.js?v=9"></script>
</body>
</html>
