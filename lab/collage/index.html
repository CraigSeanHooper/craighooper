<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Lab - Collage</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14120b" media="(prefers-color-scheme: dark)" />
  <style>
    @font-face { font-family: "FT System Blank"; src: url("/assets/fonts/FTSystem-BlankRegular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "FT System Blank"; src: url("/assets/fonts/FTSystem-BlankMedium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
    @font-face { font-family: "FT System Mono"; src: url("/assets/fonts/FTSystemMono-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }

    /* Look and feel referenced from cursor.com; not yet in Foundations. */
    :root {
      --ui-page:    #f7f7f4;
      --ui-panel:   #f0efea;
      --ui-raised:  #e6e5df;
      --ui-border:  rgba(38, 37, 30, 0.12);
      --ui-text:    #26251e;
      --ui-muted:   rgba(38, 37, 30, 0.58);
      --ui-primary: #26251e;
      --ui-on-primary: #f7f7f4;
      --ui-stage:   #ebeae4;

      --space-50: 4px; --space-100: 8px; --space-200: 12px; --space-300: 16px; --space-500: 24px;
      --radius-xs: 4px; --radius-sm: 8px; --radius-md: 12px; --radius-full: 64px;
      --font-size-12: 12px; --font-size-14: 14px; --line-height-18: 18px; --line-height-20: 20px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ui-page:    #14120b;
        --ui-panel:   #1b1913;
        --ui-raised:  #26241d;
        --ui-border:  rgba(237, 236, 228, 0.1);
        --ui-text:    #edece4;
        --ui-muted:   rgba(237, 236, 228, 0.55);
        --ui-primary: #edece4;
        --ui-on-primary: #14120b;
        --ui-stage:   #0f0d08;
      }
    }

    * { box-sizing: border-box; }
    html { color-scheme: light dark; background: var(--ui-page); }
    body {
      margin: 0; height: 100vh; height: 100dvh;
      background: var(--ui-page); color: var(--ui-text);
      font-family: "FT System Blank", "Helvetica Neue", Arial, sans-serif;
      font-size: var(--font-size-14); line-height: var(--line-height-20);
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; }
    .mono { font-family: "FT System Mono", ui-monospace, Menlo, monospace; font-size: var(--font-size-12); }

    .app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }

    /* ---------- panel ---------- */
    .panel {
      background: var(--ui-panel); border-right: 1px solid var(--ui-border);
      display: flex; flex-direction: column; min-height: 0;
    }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-300) var(--space-500); border-bottom: 1px solid var(--ui-border);
    }
    .panel-head a { color: var(--ui-muted); text-decoration: none; }
    .panel-head a:hover { color: var(--ui-text); }
    .title { font-weight: 500; }
    .panel-body { flex: 1; overflow-y: auto; padding: var(--space-200) var(--space-500) var(--space-500); }

    .group { padding: var(--space-300) 0; border-bottom: 1px solid var(--ui-border); }
    .group:last-child { border-bottom: 0; }
    .label { display: flex; justify-content: space-between; color: var(--ui-muted); margin-bottom: var(--space-200); }

    .palettes { display: grid; gap: var(--space-50); }
    .palette {
      display: flex; align-items: center; gap: var(--space-200);
      padding: var(--space-100); border: 1px solid transparent; border-radius: var(--radius-sm);
      background: none; cursor: pointer; text-align: left;
    }
    .palette:hover { background: var(--ui-raised); }
    .palette[aria-pressed="true"] { background: var(--ui-raised); border-color: var(--ui-border); }
    .chips { display: flex; gap: 3px; padding: 5px; border-radius: var(--radius-xs); box-shadow: inset 0 0 0 1px var(--ui-border); }
    .chips i { display: block; width: 14px; height: 14px; border-radius: 2px; }

    .segment {
      display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
      padding: 3px; gap: 3px; background: var(--ui-raised); border-radius: var(--radius-sm);
    }
    .segment button {
      border: 0; background: none; padding: 5px 0; border-radius: 6px; cursor: pointer; color: var(--ui-muted);
    }
    .segment button[aria-pressed="true"] { background: var(--ui-page); color: var(--ui-text); box-shadow: 0 0 0 1px var(--ui-border); }

    .slider + .slider { margin-top: var(--space-300); }
    input[type="range"] { width: 100%; accent-color: var(--ui-text); margin: 0; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-100);
      height: 34px; padding: 0 var(--space-200); border-radius: var(--radius-full);
      border: 1px solid var(--ui-border); background: var(--ui-page); cursor: pointer;
      min-width: 0; white-space: nowrap;
    }
    .btn:hover { background: var(--ui-raised); }
    .btn-primary { background: var(--ui-primary); color: var(--ui-on-primary); border-color: transparent; }
    .btn-primary:hover { background: var(--ui-primary); opacity: 0.88; }
    .btn kbd {
      font-family: "FT System Mono", ui-monospace, monospace; font-size: 11px; line-height: 16px;
      padding: 0 5px; border-radius: var(--radius-xs); background: rgba(127, 127, 127, 0.2);
    }
    .photos-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-200); }

    .panel-foot {
      display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-100);
      padding: var(--space-300) var(--space-500); border-top: 1px solid var(--ui-border);
    }
    .seed-row { grid-column: 1 / -1; display: flex; justify-content: space-between; color: var(--ui-muted); margin-bottom: var(--space-50); }

    /* ---------- stage ---------- */
    .stage {
      position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--ui-stage);
      display: grid; place-items: center; padding: 48px;
    }
    #collage {
      display: block;
      border-radius: var(--radius-xs); cursor: pointer;
      box-shadow: 0 0 0 1px var(--ui-border), 0 24px 60px rgba(0, 0, 0, 0.25);
    }
    .status { position: absolute; left: 0; right: 0; bottom: var(--space-300); text-align: center; color: var(--ui-muted); }

    @media (max-width: 819px) {
      body { height: auto; }
      .app { display: flex; flex-direction: column-reverse; height: auto; }
      .stage { padding: var(--space-300); min-height: 0; }
      .status { position: static; margin-top: var(--space-200); }
      .stage { display: block; }
      .panel { border-right: 0; border-bottom: 1px solid var(--ui-border); }
      .panel-head { display: none; }
      .panel-foot { order: -1; border-top: 0; border-bottom: 1px solid var(--ui-border); }
      .panel-body { overflow: visible; }
      .btn kbd { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel" aria-label="Controls">
      <div class="panel-head">
        <span class="title">Collage</span>
        <a class="mono" href="/">craighooper.xyz</a>
      </div>

      <div class="panel-body">
        <div class="group">
          <div class="label mono"><span>Palette</span></div>
          <div class="palettes" id="palettes"></div>
        </div>

        <div class="group">
          <div class="label mono"><span>Layout</span></div>
          <div class="segment" id="layout">
            <button type="button" data-value="grid">Grid</button>
            <button type="button" data-value="scatter">Scatter</button>
          </div>
        </div>

        <div class="group">
          <div class="label mono"><span>Format</span></div>
          <div class="segment mono" id="format">
            <button type="button" data-value="4:5">4:5</button>
            <button type="button" data-value="1:1">1:1</button>
            <button type="button" data-value="3:2">3:2</button>
            <button type="button" data-value="16:9">16:9</button>
          </div>
        </div>

        <div class="group">
          <div class="slider">
            <label class="label mono" for="density"><span>Pieces</span><span id="density-value"></span></label>
            <input type="range" id="density" min="0" max="100" />
          </div>
          <div class="slider">
            <label class="label mono" for="tears"><span>Torn edges</span><span id="tears-value"></span></label>
            <input type="range" id="tears" min="0" max="100" />
          </div>
          <div class="slider">
            <label class="label mono" for="grain"><span>Grain</span><span id="grain-value"></span></label>
            <input type="range" id="grain" min="0" max="100" />
          </div>
        </div>

        <div class="group">
          <div class="label mono"><span>Photos</span></div>
          <div class="photos-row">
            <span id="photo-count">…</span>
            <button type="button" class="btn" id="add">Add your own</button>
            <input type="file" id="file" accept="image/*" multiple hidden />
          </div>
        </div>
      </div>

      <div class="panel-foot">
        <div class="seed-row mono"><span>Seed</span><span id="seed">–</span></div>
        <button type="button" class="btn btn-primary" id="generate">Generate <kbd>Space</kbd></button>
        <button type="button" class="btn" id="download">Download <kbd>D</kbd></button>
      </div>
    </aside>

    <main class="stage">
      <canvas id="collage" width="2400" height="1600" aria-label="Generated collage"></canvas>
      <div class="status mono" id="status" role="status"></div>
    </main>
  </div>
  <script src="collage.js"></script>
</body>
</html>
