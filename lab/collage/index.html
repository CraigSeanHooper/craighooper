<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Lab - Photo Effects</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14120b" media="(prefers-color-scheme: dark)" />
  <style>
    @font-face { font-family: "FT System Blank"; src: url("/assets/fonts/FTSystem-BlankRegular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "FT System Blank"; src: url("/assets/fonts/FTSystem-BlankMedium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
    @font-face { font-family: "FT System Mono"; src: url("/assets/fonts/FTSystemMono-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }

    /* Look and feel referenced from cursor.com; not yet in Foundations. */
    :root {
      --ui-page:    #f7f7f4;
      --ui-panel:   #f0efea;
      --ui-raised:  #e6e5df;
      --ui-border:  rgba(38, 37, 30, 0.12);
      --ui-text:    #26251e;
      --ui-muted:   rgba(38, 37, 30, 0.58);
      --ui-primary: #26251e;
      --ui-on-primary: #f7f7f4;
      --ui-stage:   #ebeae4;

      --space-50: 4px; --space-100: 8px; --space-200: 12px; --space-300: 16px; --space-500: 24px;
      --radius-xs: 4px; --radius-sm: 8px; --radius-md: 12px; --radius-full: 64px;
      --font-size-12: 12px; --font-size-14: 14px; --line-height-18: 18px; --line-height-20: 20px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ui-page:    #14120b;
        --ui-panel:   #1b1913;
        --ui-raised:  #26241d;
        --ui-border:  rgba(237, 236, 228, 0.1);
        --ui-text:    #edece4;
        --ui-muted:   rgba(237, 236, 228, 0.55);
        --ui-primary: #edece4;
        --ui-on-primary: #14120b;
        --ui-stage:   #0f0d08;
      }
    }

    * { box-sizing: border-box; }
    html { color-scheme: light dark; background: var(--ui-page); }
    body {
      margin: 0; height: 100vh; height: 100dvh;
      background: var(--ui-page); color: var(--ui-text);
      font-family: "FT System Blank", "Helvetica Neue", Arial, sans-serif;
      font-size: var(--font-size-14); line-height: var(--line-height-20);
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    .mono { font-family: "FT System Mono", ui-monospace, Menlo, monospace; font-size: var(--font-size-12); }

    .app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }

    /* ---------- panel ---------- */
    .panel {
      background: var(--ui-panel); border-right: 1px solid var(--ui-border);
      display: flex; flex-direction: column; min-height: 0;
    }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-300) var(--space-500); border-bottom: 1px solid var(--ui-border);
    }
    .panel-head a { color: var(--ui-muted); text-decoration: none; }
    .panel-head a:hover { color: var(--ui-text); }
    .title { font-weight: 500; }
    .panel-body { flex: 1; overflow-y: auto; padding: var(--space-100) var(--space-500) var(--space-500); }

    .group { padding: var(--space-300) 0; border-bottom: 1px solid var(--ui-border); }
    .group:last-child { border-bottom: 0; }
    .group-title { color: var(--ui-text); margin-bottom: var(--space-300); }
    .label { display: flex; justify-content: space-between; color: var(--ui-muted); margin-bottom: var(--space-100); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-200); }
    .row + .row, .row + .slider, .slider + .row, .segment + .row, .presets + .row, .segment + .presets { margin-top: var(--space-300); }
    .slider + .slider { margin-top: var(--space-300); }
    .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ui-muted); min-width: 0; }

    .segment {
      display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
      padding: 3px; gap: 3px; background: var(--ui-raised); border-radius: var(--radius-sm);
    }
    .segment button {
      border: 0; background: none; padding: 5px 0; border-radius: 6px; cursor: pointer; color: var(--ui-muted);
    }
    .segment button[aria-pressed="true"] { background: var(--ui-page); color: var(--ui-text); box-shadow: 0 0 0 1px var(--ui-border); }

    input[type="range"] { width: 100%; accent-color: var(--ui-text); margin: 0; }
    input[type="range"]:disabled { opacity: 0.35; }

    /* colour presets */
    .presets { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .preset {
      height: 28px; padding: 0; border: 0; border-radius: 6px; cursor: pointer;
      box-shadow: 0 0 0 1px var(--ui-border); overflow: hidden; display: flex;
    }
    .preset i { flex: 1; }
    .preset:hover { box-shadow: 0 0 0 1px var(--ui-text); }

    /* colour pickers */
    .swatch-row { display: grid; grid-template-columns: 1fr auto 80px; align-items: center; gap: var(--space-200); }
    .swatch-row + .swatch-row { margin-top: var(--space-100); }
    .swatch-row[hidden] { display: none; }
    .swatch-row span { color: var(--ui-muted); }
    input[type="color"] {
      width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: none; cursor: pointer;
      box-shadow: 0 0 0 1px var(--ui-border);
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 6px; }
    input[type="color"]::-moz-color-swatch { border: 0; border-radius: 6px; }
    .hex {
      width: 80px; height: 28px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--ui-border);
      background: var(--ui-page); text-transform: uppercase;
    }
    .colours[data-off="true"] { opacity: 0.4; pointer-events: none; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-100);
      height: 34px; padding: 0 var(--space-300); border-radius: var(--radius-full);
      border: 1px solid var(--ui-border); background: var(--ui-page); cursor: pointer;
      min-width: 0; white-space: nowrap;
    }
    .btn-sm { height: 28px; padding: 0 var(--space-200); }
    .btn:hover { background: var(--ui-raised); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-primary { background: var(--ui-primary); color: var(--ui-on-primary); border-color: transparent; }
    .btn-primary:hover { background: var(--ui-primary); opacity: 0.88; }
    .btn kbd {
      font-family: "FT System Mono", ui-monospace, monospace; font-size: 11px; line-height: 16px;
      padding: 0 5px; border-radius: var(--radius-xs); background: rgba(127, 127, 127, 0.2);
    }

    .panel-foot {
      display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-100);
      padding: var(--space-300) var(--space-500); border-top: 1px solid var(--ui-border);
    }
    .panel-foot .segment { grid-column: 1 / -1; }

    /* ---------- stage ---------- */
    .stage {
      position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--ui-stage);
      display: grid; place-items: center; padding: 48px;
    }
    .stage.drop { box-shadow: inset 0 0 0 2px var(--ui-text); }
    #preview { display: block; touch-action: none; user-select: none; cursor: default; }
    #preview[hidden] { display: none; }
    .empty {
      display: grid; justify-items: center; gap: var(--space-200); text-align: center;
      padding: 48px 32px; border: 1px dashed var(--ui-border); border-radius: var(--radius-md); color: var(--ui-muted);
    }
    .empty[hidden] { display: none; }
    .status { position: absolute; left: 0; right: 0; bottom: var(--space-300); text-align: center; color: var(--ui-muted); }

    @media (max-width: 819px) {
      body { height: auto; }
      .app { display: flex; flex-direction: column-reverse; height: auto; }
      .stage { display: block; padding: var(--space-300); }
      .empty { padding: 32px 16px; }
      .status { position: static; margin-top: var(--space-200); }
      .panel { border-right: 0; border-bottom: 1px solid var(--ui-border); }
      .panel-head { display: none; }
      .panel-foot { order: -1; border-top: 0; border-bottom: 1px solid var(--ui-border); }
      .panel-body { overflow: visible; }
      .btn kbd { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel" aria-label="Controls">
      <div class="panel-head">
        <span class="title">Photo effects</span>
        <a class="mono" href="/">craighooper.xyz</a>
      </div>

      <div class="panel-body">
        <div class="group">
          <div class="row">
            <span class="file-name" id="file-name">No photo yet</span>
            <button type="button" class="btn btn-sm" id="choose">Choose photo</button>
          </div>
        </div>

        <div class="group">
          <div class="label mono group-title"><span>Colour</span></div>
          <div class="segment" id="mode">
            <button type="button" data-value="original">Original</button>
            <button type="button" data-value="duo">Duotone</button>
            <button type="button" data-value="tri">Tritone</button>
          </div>
          <div class="colours" id="colours">
            <div class="presets" id="presets" style="margin-top: 16px"></div>
            <div style="margin-top: 16px">
              <div class="swatch-row">
                <span class="mono">Shadows</span>
                <input type="color" id="c-dark" aria-label="Shadow colour" />
                <input type="text" class="hex mono" id="c-dark-hex" maxlength="7" aria-label="Shadow colour hex" />
              </div>
              <div class="swatch-row" id="mid-row">
                <span class="mono">Midtones</span>
                <input type="color" id="c-mid" aria-label="Midtone colour" />
                <input type="text" class="hex mono" id="c-mid-hex" maxlength="7" aria-label="Midtone colour hex" />
              </div>
              <div class="swatch-row">
                <span class="mono">Highlights</span>
                <input type="color" id="c-light" aria-label="Highlight colour" />
                <input type="text" class="hex mono" id="c-light-hex" maxlength="7" aria-label="Highlight colour hex" />
              </div>
            </div>
            <div class="row"><span></span><button type="button" class="btn btn-sm" id="swap">Swap shadows and highlights</button></div>
            <div class="slider" style="margin-top: 16px">
              <label class="label mono" for="amount"><span>Strength</span><span id="amount-value"></span></label>
              <input type="range" id="amount" min="0" max="100" />
            </div>
          </div>
        </div>

        <div class="group">
          <div class="label mono group-title"><span>Adjust</span></div>
          <div class="slider">
            <label class="label mono" for="brightness"><span>Brightness</span><span id="brightness-value"></span></label>
            <input type="range" id="brightness" min="-100" max="100" />
          </div>
          <div class="slider">
            <label class="label mono" for="contrast"><span>Contrast</span><span id="contrast-value"></span></label>
            <input type="range" id="contrast" min="-100" max="100" />
          </div>
          <div class="slider">
            <label class="label mono" for="midtones"><span>Midtones</span><span id="midtones-value"></span></label>
            <input type="range" id="midtones" min="-100" max="100" />
          </div>
        </div>

        <div class="group">
          <div class="label mono group-title"><span>Texture</span></div>
          <div class="slider">
            <label class="label mono" for="grain"><span>Grain</span><span id="grain-value"></span></label>
            <input type="range" id="grain" min="0" max="100" />
          </div>
          <div class="slider">
            <label class="label mono" for="grainSize"><span>Grain size</span><span id="grainSize-value"></span></label>
            <input type="range" id="grainSize" min="1" max="6" />
          </div>
          <div class="slider">
            <label class="label mono" for="speckle"><span>Speckle</span><span id="speckle-value"></span></label>
            <input type="range" id="speckle" min="0" max="100" />
          </div>
          <div class="slider">
            <label class="label mono" for="contours"><span>Contour lines</span><span id="contours-value"></span></label>
            <input type="range" id="contours" min="0" max="100" />
          </div>
          <div class="slider">
            <label class="label mono" for="density"><span>Contour density</span><span id="density-value"></span></label>
            <input type="range" id="density" min="0" max="100" />
          </div>
          <div class="row">
            <span class="mono" style="color: var(--ui-muted)">Texture colour</span>
            <div class="segment mono" id="ink" style="width: 140px">
              <button type="button" data-value="dark">Dark</button>
              <button type="button" data-value="light">Light</button>
            </div>
          </div>
          <div class="row"><span></span><button type="button" class="btn btn-sm" id="reseed">New texture pattern</button></div>
        </div>

        <div class="group">
          <div class="label mono group-title"><span>Export</span></div>
          <div class="slider">
            <label class="label mono" for="quality"><span>JPG quality</span><span id="quality-value"></span></label>
            <input type="range" id="quality" min="40" max="100" />
          </div>
          <div class="row"><span></span><button type="button" class="btn btn-sm" id="reset">Reset all</button></div>
        </div>
      </div>

      <div class="panel-foot">
        <div class="segment mono" id="format">
          <button type="button" data-value="jpg">JPG</button>
          <button type="button" data-value="png">PNG</button>
        </div>
        <button type="button" class="btn btn-primary" id="download" style="grid-column: 1 / -1" disabled>Download <kbd>D</kbd></button>
      </div>
    </aside>

    <main class="stage" id="stage">
      <div class="empty" id="empty">
        <span>Drop a photo here, or paste one</span>
        <button type="button" class="btn" id="choose-3">Choose photo</button>
      </div>
      <canvas id="preview" hidden aria-label="Edited photo"></canvas>
      <div class="status mono" id="status" role="status"></div>
    </main>
  </div>
  <input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,image/*" hidden />
  <script src="effects.js?v=1"></script>
</body>
</html>
