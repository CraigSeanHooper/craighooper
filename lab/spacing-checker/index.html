<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Lab - Spacing Checker</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
  <link rel="preload" href="/assets/fonts/Exposure10.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/Parabole-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Landing: Figma "canvas - desktop" (4520:718) -->
  <main class="screen landing">
    <div class="glow" aria-hidden="true"></div>

    <div class="stack">
      <h1 class="spacer-heading">Spacing checker</h1>

      <div class="controls">
        <div class="selector" role="group" aria-label="Breakpoint">
          <button class="toggle" data-smooth="ring" type="button" aria-pressed="true" data-breakpoint="desktop" aria-label="Desktop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4.75 6.75C4.75 5.64543 5.64543 4.75 6.75 4.75H17.25C18.3546 4.75 19.25 5.64543 19.25 6.75V14.25C19.25 15.3546 18.3546 16.25 17.25 16.25H6.75C5.64543 16.25 4.75 15.3546 4.75 14.25V6.75Z"/>
              <path d="M15.25 19.25L12 17.25L8.75 19.25"/>
            </svg>
          </button>
          <button class="toggle" data-smooth="ring" type="button" aria-pressed="false" data-breakpoint="tablet" aria-label="Tablet">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4.75 6.75C4.75 5.64543 5.64543 4.75 6.75 4.75H17.25C18.3546 4.75 19.25 5.64543 19.25 6.75V17.25C19.25 18.3546 18.3546 19.25 17.25 19.25H6.75C5.64543 19.25 4.75 18.3546 4.75 17.25V6.75Z"/>
              <path d="M12.25 16.75H11.75"/>
            </svg>
          </button>
          <button class="toggle" data-smooth="ring" type="button" aria-pressed="false" data-breakpoint="phone" aria-label="Phone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15.2502 19.25H8.75C7.64543 19.25 6.75 18.3546 6.75 17.25V6.75C6.75 5.64543 7.64543 4.75 8.75 4.75H15.2502C16.3548 4.75 17.2502 5.64543 17.2502 6.75V17.25C17.2502 18.3546 16.3548 19.25 15.2502 19.25Z"/>
              <path d="M11.75 16.75H12.25"/>
            </svg>
          </button>
        </div>

        <form class="field" data-smooth="edge ring" autocomplete="off">
          <input class="body-sm" type="text" name="url" inputmode="url" spellcheck="false"
                 placeholder="You know what to do..." aria-label="Page address" />
          <button class="go" data-smooth="ring" type="submit" aria-label="Check spacing">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13.75 6.75L19.25 12L13.75 17.25"/>
              <path d="M19 12H4.75"/>
            </svg>
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- Under 1024 wide: Figma "canvas - desktop - message" (4567:213) -->
  <div class="screen small-screen">
    <div class="glow" aria-hidden="true"></div>
    <p class="spacer-heading">Not optimized for phones or small screens</p>
  </div>

  <script src="smooth-corners.js"></script>
  <script src="script.js"></script>
</body>
</html>
