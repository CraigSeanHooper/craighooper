<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Spacing Checker — Craig Hooper</title>
  <meta name="description" content="Check the vertical spacing between a page's main sections at desktop, tablet and phone widths." />
  <meta property="og:title" content="Spacing Checker — Craig Hooper" />
  <meta property="og:site_name" content="Craig Hooper" />
  <meta property="og:description" content="Check the vertical spacing between a page's main sections at desktop, tablet and phone widths." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://craighooper.xyz/lab/spacing-checker/" />
  <meta property="og:image" content="https://craighooper.xyz/assets/share-card.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Spacing Checker — Craig Hooper" />
  <meta name="twitter:description" content="Check the vertical spacing between a page's main sections at desktop, tablet and phone widths." />
  <meta name="twitter:image" content="https://craighooper.xyz/assets/share-card.jpg" />
  <link rel="icon" href="/assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="preload" href="/assets/fonts/Exposure10.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Landing: Figma "canvas - desktop" (4520:718) -->
  <main class="screen landing">
    <div class="glow" aria-hidden="true"></div>

    <div class="stack">
      <h1 class="interface-heading">Spacing checker</h1>

      <div class="controls">
        <div class="selector" data-smooth="" role="group" aria-label="Breakpoint">
          <button class="toggle" data-smooth="ring" type="button" aria-pressed="true" data-breakpoint="desktop" aria-label="Desktop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5.75 14.75H4.75V16.25C4.75 17.3546 5.6454 18.25 6.75 18.25H17.25C18.3546 18.25 19.25 17.3546 19.25 16.25V14.75H14C14 14.75 13.6562 15.75 12 15.75C10.3438 15.75 10 14.75 10 14.75H5.75ZM5.75 14.75V6.75C5.75 6.1977 6.1977 5.75 6.75 5.75H17.25C17.8023 5.75 18.25 6.1977 18.25 6.75V14.75"/>
            </svg>
          </button>
          <button class="toggle" data-smooth="ring" type="button" aria-pressed="false" data-breakpoint="tablet" aria-label="Tablet">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4.75 6.75C4.75 5.64543 5.64543 4.75 6.75 4.75H17.25C18.3546 4.75 19.25 5.64543 19.25 6.75V17.25C19.25 18.3546 18.3546 19.25 17.25 19.25H6.75C5.64543 19.25 4.75 18.3546 4.75 17.25V6.75Z"/>
              <path d="M12.25 16.75H11.75"/>
            </svg>
          </button>
          <button class="toggle" data-smooth="ring" type="button" aria-pressed="false" data-breakpoint="phone" aria-label="Phone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15.2502 19.25H8.75C7.64543 19.25 6.75 18.3546 6.75 17.25V6.75C6.75 5.64543 7.64543 4.75 8.75 4.75H15.2502C16.3548 4.75 17.2502 5.64543 17.2502 6.75V17.25C17.2502 18.3546 16.3548 19.25 15.2502 19.25Z"/>
              <path d="M11.75 16.75H12.25"/>
            </svg>
          </button>
        </div>

        <form class="field" data-smooth="edge ring" autocomplete="off">
          <input class="interface-body-sm" type="text" name="url" inputmode="url" spellcheck="false"
                 placeholder="You know what to do..." aria-label="Page address" />
          <button class="go" data-smooth="ring" type="submit" aria-label="Check spacing">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13.75 6.75L19.25 12L13.75 17.25"/>
              <path d="M19 12H4.75"/>
            </svg>
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- After an address is entered: Figma "canvas - desktop / loading" (4577:222) -->
  <div class="screen tool" hidden>
    <div class="page"></div>
    <div class="progress" aria-hidden="true"></div>

    <div class="bar-area">
      <div class="strip" data-smooth="">
        <!-- the breakpoint selector is copied in here from the landing screen -->
        <span class="width interface-body-sm" aria-label="Width being measured"></span>

        <form class="field" data-smooth="edge ring" autocomplete="off">
          <input class="interface-body-sm" type="text" name="url" inputmode="url" spellcheck="false"
                 placeholder="You know what to do..." aria-label="Page address" />
          <button class="go" data-smooth="ring" type="submit" aria-label="Check spacing">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13.75 6.75L19.25 12L13.75 17.25"/>
              <path d="M19 12H4.75"/>
            </svg>
          </button>
        </form>

        <button class="switch" type="button" role="switch" aria-checked="true">
          <span class="interface-body-sm">Specs</span>
          <span class="track" aria-hidden="true"><span class="knob"></span></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Under 1024 wide: Figma "canvas - desktop - message" (4567:213) -->
  <div class="screen small-screen">
    <div class="glow" aria-hidden="true"></div>
    <p class="interface-heading">Not optimized for phones or small screens</p>
  </div>

  <script src="script.js"></script>
  <script src="smooth-corners.js"></script>
</body>
</html>
