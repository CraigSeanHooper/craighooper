<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex" />
  <title>Lab — Craig Hooper</title>
  <style>
    :root { --bg: #f4f4f2; --ink: #1a1a1a; --stage-w: 5000px; --stage-h: 3200px; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: "Helvetica Neue", Arial, sans-serif;
      overflow: hidden; -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    #viewport { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
    #viewport.panning { cursor: grabbing; }

    #stage {
      position: absolute; top: 0; left: 0;
      width: var(--stage-w); height: var(--stage-h);
      transform-origin: 0 0; will-change: transform;
    }

    .cluster { position: absolute; cursor: grab; touch-action: none; user-select: none; }
    .cluster.moving { cursor: grabbing; }
    .cluster img { display: block; width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; user-select: none; }

    /* --- placeholder UI controls (reskin later) --- */
    .controls {
      position: fixed; right: 18px; bottom: 18px; z-index: 10;
      display: flex; flex-direction: column; gap: 6px;
    }
    .controls button {
      width: 40px; height: 40px; font-size: 18px; line-height: 1;
      color: var(--ink); background: #fff; border: 1px solid rgba(0,0,0,0.14);
      border-radius: 10px; cursor: pointer;
    }
    .controls button#fit { font-size: 12px; letter-spacing: 0.03em; }
    .controls button:hover { background: #fafafa; }
    .controls .zoompct {
      width: 40px; text-align: center; padding: 6px 0; font-size: 11px;
      color: var(--ink); background: #fff; border: 1px solid rgba(0,0,0,0.14);
      border-radius: 10px; font-variant-numeric: tabular-nums;
    }

    .hint {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      padding: 10px 16px; font-size: 13px; letter-spacing: 0.02em; text-align: center;
      color: #fff; background: rgba(26,26,26,0.82); border-radius: 999px;
      pointer-events: none; transition: opacity 0.4s ease; z-index: 9; max-width: 86vw;
    }
    .hint.hide { opacity: 0; }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <div class="cluster" style="left:376px;  top:352px;  width:1040px; height:1040px;"><img src="assets/skulls.png" alt="" /></div>
      <div class="cluster" style="left:3084px; top:328px;  width:699px;  height:256px;"><img src="assets/lm.png" alt="" /></div>
      <div class="cluster" style="left:1498px; top:2096px; width:772px;  height:400px;"><img src="assets/cock.png" alt="" /></div>
      <div class="cluster" style="left:3578px; top:2380px; width:1221px; height:740px;"><img src="assets/text.png" alt="" /></div>
      <div class="cluster" style="left:2468px; top:1568px; width:64px;   height:64px;"><img src="assets/avatar.png" alt="" /></div>
    </div>
  </div>

  <div class="controls">
    <div class="zoompct" id="zoompct">100%</div>
    <button id="zin" aria-label="Zoom in">+</button>
    <button id="zout" aria-label="Zoom out">&minus;</button>
    <button id="fit" aria-label="Fit to screen">FIT</button>
  </div>
  <div class="hint" id="hint">Drag to move pieces · pinch or ⌘-scroll to zoom</div>

  <script>
    (function () {
      var viewport = document.getElementById('viewport');
      var stage = document.getElementById('stage');
      var hint = document.getElementById('hint');
      var clusters = [].slice.call(document.querySelectorAll('.cluster'));
      var STAGE_W = 5000, STAGE_H = 3200, PAD = 40;
      var MAX = 1;   // 100% = native design size; never upscale past it

      var s = 1, x = 0, y = 0, topZ = 1, hinted = false;
      function vw(){ return window.innerWidth; }
      function vh(){ return window.innerHeight; }
      function fitScale(){ return Math.min((vw()-PAD*2)/STAGE_W, (vh()-PAD*2)/STAGE_H); }
      function minScale(){ return fitScale(); }

      function clamp() {
        s = Math.max(minScale(), Math.min(MAX, s));
        var cw = STAGE_W*s, ch = STAGE_H*s;
        if (cw <= vw()) x = (vw()-cw)/2; else x = Math.min(0, Math.max(vw()-cw, x));
        if (ch <= vh()) y = (vh()-ch)/2; else y = Math.min(0, Math.max(vh()-ch, y));
      }
      function apply() {
        clamp();
        stage.style.transform = 'translate3d('+x+'px,'+y+'px,0) scale('+s+')';
        var pct = document.getElementById('zoompct');
        if (pct) pct.textContent = Math.round(s*100) + '%';
      }
      function fit() { s = fitScale(); x = (vw()-STAGE_W*s)/2; y = (vh()-STAGE_H*s)/2; apply(); }
      function zoomAround(px, py, ns) {
        ns = Math.max(minScale(), Math.min(MAX, ns));
        var stX = (px - x)/s, stY = (py - y)/s;
        s = ns; x = px - stX*s; y = py - stY*s; apply();
      }
      function dismissHint(){ if(!hinted){ hinted=true; hint.classList.add('hide'); } }

      // ---------- pointer state ----------
      var pts = {};        // active pointers on viewport (background gestures)
      var panOX, panOY;    // pan origin
      var pinch = null;    // {dist, cx, cy}

      function bgPointers(){ return Object.keys(pts).length; }

      viewport.addEventListener('pointerdown', function (e) {
        if (e.target.closest('.cluster')) return;     // clusters handle themselves
        pts[e.pointerId] = { x: e.clientX, y: e.clientY };
        viewport.setPointerCapture(e.pointerId);
        if (bgPointers() === 1) { viewport.classList.add('panning'); panOX = x; panOY = y; }
        else if (bgPointers() === 2) {
          var p = Object.keys(pts).map(function(k){return pts[k];});
          pinch = { dist: Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y),
                    cx: (p[0].x+p[1].x)/2, cy: (p[0].y+p[1].y)/2, s0: s };
        }
      });
      viewport.addEventListener('pointermove', function (e) {
        if (!(e.pointerId in pts)) return;
        var prev = pts[e.pointerId];
        pts[e.pointerId] = { x: e.clientX, y: e.clientY };
        if (bgPointers() === 2 && pinch) {
          var p = Object.keys(pts).map(function(k){return pts[k];});
          var dist = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
          var cx = (p[0].x+p[1].x)/2, cy = (p[0].y+p[1].y)/2;
          zoomAround(cx, cy, pinch.s0 * (dist/pinch.dist));
          x += cx - pinch.cx; y += cy - pinch.cy; apply();
          pinch.cx = cx; pinch.cy = cy; dismissHint();
        } else if (bgPointers() === 1) {
          x += e.clientX - prev.x; y += e.clientY - prev.y; apply(); dismissHint();
        }
      });
      function bgUp(e) {
        if (!(e.pointerId in pts)) return;
        delete pts[e.pointerId];
        try { viewport.releasePointerCapture(e.pointerId); } catch (err) {}
        if (bgPointers() < 2) pinch = null;
        if (bgPointers() === 0) viewport.classList.remove('panning');
      }
      viewport.addEventListener('pointerup', bgUp);
      viewport.addEventListener('pointercancel', bgUp);

      // ---------- wheel: ctrl/⌘ = zoom (trackpad pinch sends ctrlKey), else pan ----------
      viewport.addEventListener('wheel', function (e) {
        e.preventDefault();
        if (e.ctrlKey || e.metaKey) { zoomAround(e.clientX, e.clientY, s * (1 - e.deltaY*0.01)); }
        else { x -= e.deltaX; y -= e.deltaY; apply(); }
        dismissHint();
      }, { passive: false });

      // ---------- cluster dragging (scale-aware) ----------
      clusters.forEach(function (el) {
        var sx, sy, ox, oy, dragging = false;
        el.addEventListener('pointerdown', function (e) {
          e.stopPropagation();
          dragging = true; el.classList.add('moving');
          el.setPointerCapture(e.pointerId); el.style.zIndex = ++topZ;
          sx = e.clientX; sy = e.clientY;
          ox = parseFloat(el.style.left); oy = parseFloat(el.style.top);
        });
        el.addEventListener('pointermove', function (e) {
          if (!dragging) return;
          el.style.left = (ox + (e.clientX - sx)/s) + 'px';
          el.style.top  = (oy + (e.clientY - sy)/s) + 'px';
          dismissHint();
        });
        function done(e){ if(!dragging) return; dragging=false; el.classList.remove('moving'); try{el.releasePointerCapture(e.pointerId);}catch(err){} }
        el.addEventListener('pointerup', done);
        el.addEventListener('pointercancel', done);
      });

      // ---------- controls ----------
      document.getElementById('zin').addEventListener('click', function(){ zoomAround(vw()/2, vh()/2, s*1.25); });
      document.getElementById('zout').addEventListener('click', function(){ zoomAround(vw()/2, vh()/2, s*0.8); });
      document.getElementById('fit').addEventListener('click', fit);
      window.addEventListener('resize', apply);

      fit();   // open showing the whole field
    })();
  </script>
</body>
</html>
