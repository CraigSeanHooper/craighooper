<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Lab - Texture Generator</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
  <style>
    @font-face { font-family: "KMR Melange Grotesk"; src: url("/assets/fonts/KMRMelangeGrotesk-Book.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "KMR Melange Grotesk"; src: url("/assets/fonts/KMRMelangeGrotesk-SemiBold.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
    @font-face { font-family: "KMR Melange Grotesk"; src: url("/assets/fonts/KMRMelangeGrotesk-Medium.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }

    /* Look and feel referenced from base-ui.com; not yet in Foundations. */
    :root {
      --ui-page:     #ffffff;
      --ui-subtle:   #f9f9f9;
      --ui-control:  #f3f3f3;
      --ui-hover:    #ececec;
      --ui-border:   #e2e2e2;
      --ui-border-strong: #c9c9c9;
      --ui-text:     #2e2e2e;
      --ui-muted:    #767676;
      --ui-primary:  #2e2e2e;
      --ui-on-primary: #ffffff;
      --ui-focus:    oklch(0.55 0.2 264);
      --ui-slider:   #6e6e6e;
      --surface-action: #da6a3a;         /* Foundations: surface/action (colour/clay/50) */
      --surface-action-hover: #bd592c;   /* Foundations: surface/action-hover (colour/clay/60) */
      --text-on-action: #ffffff;         /* Foundations: text/on-action (colour/neutral/0) */
      --colour-neutral-10: #e6e6e6;      /* Foundations: colour/neutral/10 */
      --colour-neutral-80: #333333;      /* Foundations */
      --border-subtle: #e6e6e6;          /* Foundations: border/subtle (colour/neutral/10) */
      /* Foundations effect style shadow/sm-up: shadow/sm flipped to cast straight up */
      --shadow-sm-up: 0 -1px 4.5px rgba(0, 0, 0, 0.048), 0 -5px 10.5px rgba(0, 0, 0, 0.036), 0 -12px 13.5px rgba(0, 0, 0, 0.024), 0 -22px 16.5px rgba(0, 0, 0, 0.006);
      --ui-tab-selected: var(--colour-neutral-10);

      --space-50: 4px; --space-100: 8px; --space-150: 12px; --space-200: 16px; --space-300: 24px; --space-400: 32px; --space-500: 40px;
      --radius: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ui-page:     #111111;
        --ui-subtle:   #181818;
        --ui-control:  #1f1f1f;
        --ui-hover:    #262626;
        --ui-border:   #2e2e2e;
        --ui-border-strong: #454545;
        --ui-text:     #ececec;
        --ui-muted:    #8e8e8e;
        --ui-primary:  #ececec;
        --ui-on-primary: #111111;
        --ui-focus:    oklch(0.72 0.15 264);
        --ui-slider:   #a8a8a8;
        --ui-tab-selected: var(--colour-neutral-80);
        --border-subtle: #333333;        /* Foundations: border/subtle in dark mode (colour/neutral/80) */
      }
      .avatar img { filter: invert(1); }
    }

    * { box-sizing: border-box; }
    html { color-scheme: light dark; background: var(--ui-page); }
    body {
      margin: 0; height: 100vh; height: 100dvh;
      background: var(--ui-page); color: var(--ui-text);
      font-family: "KMR Melange Grotesk", "Helvetica Neue", Arial, sans-serif;
      font-weight: 400; font-synthesis: none;
      font-feature-settings: "ss08" 1;
      font-size: 14px; line-height: 22px;
      -webkit-font-smoothing: antialiased;
    }
    button, input, output { font: inherit; font-feature-settings: inherit; color: inherit; }

    /* ---------- squircle shapes ----------
       .sq elements get smoothed corners from effects.js, which writes the
       outline (--sq-outer) and a 1px-smaller copy (--sq-inner) as clip paths.
       The element's own background is the border colour; ::before is the fill.
       Before the script runs, plain rounded corners stand in. */
    .sq {
      --r: var(--radius);
      --sq-line: var(--ui-border);
      --sq-fill: var(--ui-page);
      position: relative; isolation: isolate; border: 0;
      background: var(--sq-line);
      clip-path: var(--sq-outer, inset(0 round var(--r)));
    }
    .sq::before {
      content: ""; position: absolute; inset: 1px; z-index: -1; pointer-events: none;
      background: var(--sq-fill);
      clip-path: var(--sq-inner, inset(0 round calc(var(--r) - 1px)));
    }
    .sq:focus-visible { outline: none; --sq-line: var(--ui-focus); }

    .app { display: grid; grid-template-columns: 380px 1fr; grid-template-rows: 1fr; height: 100%; }

    /* ---------- avatar: top of the sidebar, scrolls with it (no header strip) ---------- */
    .avatar { display: block; width: 40px; height: 40px; border-radius: 50%; margin-bottom: var(--space-300); }
    .avatar-mobile { display: none; }
    .avatar img { display: block; width: 40px; height: 40px; }
    .avatar:focus-visible { outline: 2px solid var(--ui-focus); outline-offset: 3px; }

    /* ---------- sidebar: sections separated by space, not lines ---------- */
    .panel { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border-subtle); }
    .panel-body { flex: 1; overflow-y: auto; padding: var(--space-300); }
    .section + .section { margin-top: var(--space-500); }
    .heading { color: var(--ui-muted); margin: 0 0 var(--space-150); font-size: 12px; line-height: 18px; font-weight: 400; }

    .field + .field { margin-top: var(--space-200); }
    .field-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-100); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-150); }
    .stack > * + * { margin-top: var(--space-200); }


    /* buttons */
    .btn {
      --sq-fill: var(--ui-subtle);
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-100);
      height: 40px; padding: 0 var(--space-200); cursor: pointer; white-space: nowrap;
      font-size: 12px; font-weight: 600;   /* button labels: Melange SemiBold, sentence case */
    }
    .btn:hover { --sq-fill: var(--ui-control); }
    .btn:active { --sq-fill: var(--ui-hover); }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .btn-lg { height: 40px; padding: 0 var(--space-200); }
    .btn-primary { --sq-line: var(--surface-action); --sq-fill: var(--surface-action); color: var(--text-on-action); }
    .btn-primary:hover { --sq-line: var(--surface-action-hover); --sq-fill: var(--surface-action-hover); }
    .btn-primary:disabled { opacity: 0.6; }
    .btn-primary:focus-visible { --sq-line: var(--ui-focus); }

    /* choices (colour mode, format): plain text, the selected one sits in a light grey 8px squircle */
    .tabs { display: flex; gap: var(--space-50); }
    .tabs button {
      --sq-line: transparent; --sq-fill: transparent;
      height: 32px; padding: 0 var(--space-150); cursor: pointer; color: var(--ui-muted);
    }
    .tabs button:hover { color: var(--ui-text); }
    .tabs button[aria-pressed="true"] { color: var(--ui-text); --sq-line: var(--ui-tab-selected); --sq-fill: var(--ui-tab-selected); }
    .tabs button:focus-visible { --sq-line: var(--ui-focus); }

    /* slider: 6px rounded track filled to the value, capsule handle (like the iOS toggle) */
    input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 0; background: none; cursor: pointer;
      --p: 50%;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px; border-radius: 6px;
      background: linear-gradient(to right, var(--ui-slider) var(--p), var(--ui-border) var(--p));
    }
    input[type="range"]::-moz-range-track { height: 6px; border-radius: 6px; background: var(--ui-border); }
    input[type="range"]::-moz-range-progress { height: 6px; border-radius: 6px; background: var(--ui-slider); }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 28px; height: 18px; margin-top: -6px; border-radius: 999px;
      background: #fff; border: 1px solid var(--ui-border-strong);
    }
    input[type="range"]::-moz-range-thumb {
      width: 26px; height: 16px; border-radius: 999px; background: #fff;
      border: 1px solid var(--ui-border-strong); box-shadow: none;
    }
    input[type="range"]:focus-visible { outline: none; }
    input[type="range"]:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--ui-focus); outline-offset: 2px; }
    input[type="range"]:disabled { cursor: default; }

    /* colour presets: the chips are clipped to the inner shape, so the line shows round them */
    .presets { display: flex; justify-content: space-between; }
    /* colour presets: plain circles, no outline, split into the preset's colours */
    .preset {
      flex: none; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%; overflow: hidden;
      background: none; cursor: pointer; transition: transform 0.12s ease;
    }
    .preset .chips { display: flex; width: 100%; height: 100%; }
    .preset .chips i { flex: 1; }
    .preset:hover { transform: scale(1.08); }
    /* the black-and-white chip gets a hairline so its white half doesn't vanish into the page */
    .preset:last-child { position: relative; }
    .preset:last-child::after {
      content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
      box-shadow: inset 0 0 0 1px var(--border-subtle);
    }
    .preset:focus-visible { outline: 2px solid var(--ui-focus); outline-offset: 2px; }

    /* colour fields: swatch inside a text input */
    /* colour fields: label, then its hex box 12px after the longest label, so the boxes line up */
    .colour-fields { display: grid; grid-template-columns: max-content max-content; align-items: center; column-gap: var(--space-150); row-gap: var(--space-100); }
    .colour-field { display: contents; }
    .colour-field[hidden] { display: none; }
    .input { display: inline-flex; align-items: center; gap: var(--space-100); height: 32px; padding: 0 10px 0 5px; }   /* hugs its contents; effects.js sizes the text field to the hex code */
    .input:focus-within { --sq-line: var(--ui-focus); }
    .input input[type="text"] { width: 7ch; padding: 0; border: 0; background: none; outline: none; text-transform: uppercase; }
    .input.num { padding: 0 10px; }
    .input.num input { text-align: center; }
    input[type="color"] {
      --r: 5px;
      width: 22px; height: 22px; padding: 0; border: 0; background: none; cursor: pointer; flex: none;
      clip-path: var(--sq-outer, inset(0 round 5px));
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 0; }
    input[type="color"]::-moz-color-swatch { border: 0; border-radius: 0; }
    .colours[data-off="true"] { opacity: 0.4; pointer-events: none; }
    #quality-field[data-off="true"] { opacity: 0.4; pointer-events: none; }   /* PNG has no quality setting */

    .panel-foot {
      display: grid; padding: var(--space-300);   /* 24px all round, so Download sits centred */
      position: relative; z-index: 1; background: var(--ui-page);
      box-shadow: var(--shadow-sm-up);   /* lifts Download above the controls scrolling behind it */
    }

    /* ---------- stage ---------- */
    .stage {
      position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--ui-page);
      display: grid; place-items: center; padding: 24px 56px 56px 32px;
    }
    .stage.drop { box-shadow: inset 0 0 0 2px var(--ui-focus); }   /* photos can still be dropped or pasted here */
    #preview { display: block; touch-action: none; user-select: none; }
    #preview[hidden] { display: none; }
    .status { position: absolute; left: 0; right: 0; bottom: var(--space-200); text-align: center; color: var(--ui-muted); font-size: 12px; }

    @media (max-width: 819px) {
      body { height: auto; }
      .app { display: flex; flex-direction: column; height: auto; }
      .avatar-mobile { display: block; margin: var(--space-200) var(--space-200) var(--space-200); }
      .panel-body .avatar { display: none; }
      .panel { border-right: 0; }
      .stage { display: block; padding: 0 var(--space-200); order: 1; }
      .status { position: static; margin-top: var(--space-100); }
      .panel { order: 2; }
      .panel-foot { order: -1; padding: var(--space-300) var(--space-200) 0; box-shadow: none; }
      .panel-body { overflow: visible; padding: var(--space-500) var(--space-200) var(--space-400); }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- small screens: avatar above the photo; it scrolls away with the page -->
    <a class="avatar avatar-mobile" href="/" aria-label="Craig Hooper, home"><img src="/assets/avatar.png" alt="" width="40" height="40" /></a>

    <aside class="panel" aria-label="Controls">
      <div class="panel-body">
        <a class="avatar" href="/" aria-label="Craig Hooper, home"><img src="/assets/avatar.png" alt="" width="40" height="40" /></a>
        <section class="section">
          <button type="button" class="btn btn-lg sq" id="choose" style="width: 100%">Choose photo</button>
        </section>

        <section class="section stack">
          <h2 class="heading">Colour</h2>
          <div class="tabs" id="mode">
            <button type="button" class="sq" data-value="original">Original</button>
            <button type="button" class="sq" data-value="duo">Duotone</button>
            <button type="button" class="sq" data-value="tri">Tritone</button>
          </div>
          <div class="colours stack" id="colours">
            <div class="presets" id="presets"></div>
            <div class="colour-fields">
              <label class="colour-field">
                <span>Shadows</span>
                <span class="input sq"><input type="color" id="c-dark" aria-label="Shadow colour" /><input type="text" class="mono" id="c-dark-hex" maxlength="7" aria-label="Shadow colour hex" /></span>
              </label>
              <label class="colour-field" id="mid-row">
                <span>Midtones</span>
                <span class="input sq"><input type="color" id="c-mid" aria-label="Midtone colour" /><input type="text" class="mono" id="c-mid-hex" maxlength="7" aria-label="Midtone colour hex" /></span>
              </label>
              <label class="colour-field">
                <span>Highlights</span>
                <span class="input sq"><input type="color" id="c-light" aria-label="Highlight colour" /><input type="text" class="mono" id="c-light-hex" maxlength="7" aria-label="Highlight colour hex" /></span>
              </label>
            </div>
            <div class="field">
              <div class="field-head"><label for="amount">Strength</label><span class="input sq num"><input type="text" inputmode="numeric" id="amount-value" aria-label="Strength value" /></span></div>
              <input type="range" id="amount" min="0" max="100" />
            </div>
          </div>
        </section>

        <section class="section">
          <h2 class="heading">Adjust</h2>
          <div class="field">
            <div class="field-head"><label for="brightness">Brightness</label><span class="input sq num"><input type="text" inputmode="numeric" id="brightness-value" aria-label="Brightness value" /></span></div>
            <input type="range" id="brightness" min="-100" max="100" />
          </div>
          <div class="field">
            <div class="field-head"><label for="contrast">Contrast</label><span class="input sq num"><input type="text" inputmode="numeric" id="contrast-value" aria-label="Contrast value" /></span></div>
            <input type="range" id="contrast" min="-100" max="100" />
          </div>
          <div class="field">
            <div class="field-head"><label for="midtones">Midtones</label><span class="input sq num"><input type="text" inputmode="numeric" id="midtones-value" aria-label="Midtones value" /></span></div>
            <input type="range" id="midtones" min="-100" max="100" />
          </div>
        </section>

        <section class="section">
          <h2 class="heading">Effects</h2>
          <div class="field">
            <div class="field-head"><label for="misregister">Misregistration</label><span class="input sq num"><input type="text" inputmode="numeric" id="misregister-value" aria-label="Misregistration value" /></span></div>
            <input type="range" id="misregister" min="0" max="100" />
          </div>
          <div class="field">
            <div class="field-head"><label for="vignette">Vignette</label><span class="input sq num"><input type="text" inputmode="numeric" id="vignette-value" aria-label="Vignette value" /></span></div>
            <input type="range" id="vignette" min="0" max="100" />
          </div>
        </section>

        <section class="section">
          <h2 class="heading">Texture</h2>
          <div class="field">
            <div class="field-head"><label for="grain">Grain</label><span class="input sq num"><input type="text" inputmode="numeric" id="grain-value" aria-label="Grain value" /></span></div>
            <input type="range" id="grain" min="0" max="100" />
          </div>
          <div class="field">
            <div class="field-head"><label for="grainSize">Grain size</label><span class="input sq num"><input type="text" inputmode="numeric" id="grainSize-value" aria-label="Grain size value" /></span></div>
            <input type="range" id="grainSize" min="1" max="6" />
          </div>
          <div class="field">
            <div class="field-head"><label for="speckle">Speckle</label><span class="input sq num"><input type="text" inputmode="numeric" id="speckle-value" aria-label="Speckle value" /></span></div>
            <input type="range" id="speckle" min="0" max="100" />
          </div>
        </section>

        <section class="section">
          <h2 class="heading">Export</h2>
          <div class="field row">
            <span>Format</span>
            <div class="tabs" id="format">
              <button type="button" class="sq" data-value="jpg">JPG</button>
              <button type="button" class="sq" data-value="png">PNG</button>
            </div>
          </div>
          <div class="field" id="quality-field">
            <div class="field-head"><label for="quality">JPG quality</label><span class="input sq num"><input type="text" inputmode="numeric" id="quality-value" aria-label="JPG quality value" /></span></div>
            <input type="range" id="quality" min="40" max="100" />
          </div>
          <div class="field">
            <button type="button" class="btn sq" id="reset" style="width: 100%">Reset all settings</button>
          </div>
        </section>
      </div>

      <div class="panel-foot">
        <button type="button" class="btn btn-primary btn-lg sq" id="download" style="width: 100%" disabled>Download</button>
      </div>
    </aside>

    <main class="stage" id="stage">
      <canvas id="preview" hidden aria-label="Edited photo"></canvas>
      <div class="status mono" id="status" role="status"></div>
    </main>
  </div>
  <input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,image/*" hidden />
  <script src="effects.js?v=28"></script>
</body>
</html>
