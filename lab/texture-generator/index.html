  <style>
    @font-face { font-family: "Inter"; src: url("/assets/fonts/Inter-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Exposure"; src: url("/assets/fonts/Exposure10.woff2") format("woff2"); font-weight: 425; font-style: normal; font-display: swap; }   /* Exposure [-10], its single cut */
    @font-face { font-family: "Inter"; src: url("/assets/fonts/Inter-SemiBold.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }

    /* Foundations tokens, Light only: this tool has no dark mode.
       Figma names in the comments. Space names follow this repo, not Figma
       (Figma space/200 = 12px, CSS --space-200 = 16px), so go by the pixels. */
    :root {
      --surface-page: #ffffff;           /* surface/page */
      --border-subtle: #e6e6e6;          /* border/subtle */
      --text-primary: #1a1a1a;           /* text/primary */
      --text-secondary: #4d4d4d;         /* text/secondary */
      --text-muted: #808080;             /* text/muted */
      --icon-disabled: #b3b3b3;          /* icon/disabled */
      --icon-primary: #1a1a1a;           /* icon/primary */
      --surface-accent: #fffbc6;         /* surface/accent: the only colour, "you are here" */
      --text-on-accent: #1a1a1a;         /* text/on-accent */
      --control-fill-hover: #e6e6e6;     /* control/fill/hover */
      --control-fill-field: #ffffff;     /* control/fill/field */
      --control-fill-on-panel: #f2f2f2;  /* control/fill/on-panel */
      --border-focus: #1a1a1a;           /* border/focus */
      --border-selected: #1a1a1a;        /* border/selected: the preset in use */
      --control-switch-track-on: #1a1a1a;   /* control/switch/track-on: the slider's fill */
      --control-segment-track: #e6e6e6;  /* control/segment/track */
      --surface-scrim: rgba(0, 0, 0, 0.8);   /* surface/scrim */
      --surface-action: #333333;         /* surface/action */
      --surface-action-hover: #1a1a1a;   /* surface/action-hover */
      --text-on-action: #ffffff;         /* text/on-action */
      --drop-outline: oklch(0.55 0.2 264);   /* thin blue outline while a photo is dragged in */

      --space-50: 4px; --space-100: 8px; --space-150: 12px; --space-200: 16px; --space-300: 24px; --space-400: 32px; --space-500: 40px;
      --radius-xs: 4px;                  /* radius/xs */
      --radius: 8px;                     /* radius/sm */
      --radius-lg: 16px;                 /* radius/lg */
      --radius-full: 999px;              /* radius/full */
      --stroke-sm: 1px;                  /* stroke/sm */
      --focus-ring: 2px;

      --font-size-12: 12px; --line-height-18: 18px;   /* section headings, button labels */
      --font-size-14: 14px; --line-height-20: 20px;   /* everything else */
      --font-size-24: 24px; --line-height-26: 26px;   /* interface/heading/sm: Choose photo on phones */
      --font-size-32: 32px; --line-height-34: 34px;   /* interface/heading/lg: Choose photo on desktop */
      --font-family-exposure: "Exposure", "Helvetica Neue", Arial, sans-serif;
      --font-weight-exposure: 425;
      --letter-spacing-heading: -0.5px;

      --rail-width: 64px;
      --panel-width: 380px;
      --rail-button: 40px;
      --icon-md: 24px;
      --icon-sm: 20px;
      --control-height: 32px;            /* tabs, hex boxes */
      --button-height: calc(var(--space-150) * 2 + var(--line-height-20) + var(--stroke-sm) * 2);   /* 46: 12 + 20 + 12 inside the 1px outline */
      --tab-width: 80px;
      --swatch: 24px;
      --chip: 32px;
      --label-column: 80px;              /* as wide as "Highlights", so the hex boxes line up */
      --slider-bar: var(--space-150);    /* 12 tall on desktop (Figma Size=Large, space/200); 16 on phones */
      --dialog-width: 379px;

      /* mobile (below 1024): bottom bar and sheets, designed at 390 */
      --control-fill-open: #cccccc;      /* control/fill/open: the sheet grabber */
      --header-height: calc(var(--space-200) * 2 + var(--rail-button));                      /* avatar, 16 in: 72 */
      --bar-height: calc(var(--space-150) * 2 + var(--rail-button) + var(--stroke-sm));      /* 65, plus the phone's safe area */
      --sheet-height: 236px;             /* every phone menu (Craig, 9 November: 314 until the colour fields were hidden) */
      --grabber-width: 36px;
      --grabber-height: 4px;
      /* Foundations effect style shadow/md-up */
      --shadow-md-up: drop-shadow(0 -3px 9px rgba(0, 0, 0, 0.05)) drop-shadow(0 -10px 16.5px rgba(0, 0, 0, 0.04)) drop-shadow(0 -22px 24px rgba(0, 0, 0, 0.02)) drop-shadow(0 -38px 27px rgba(0, 0, 0, 0.01));
      /* Foundations effect style shadow/lg, as drop shadows so it follows the squircle */
      --shadow-sm: drop-shadow(1px 1px 2.25px rgba(0, 0, 0, 0.05)) drop-shadow(3px 5px 5.25px rgba(0, 0, 0, 0.04)) drop-shadow(8px 12px 6.75px rgba(0, 0, 0, 0.02)) drop-shadow(14px 22px 8.25px rgba(0, 0, 0, 0.01));   /* shadow/sm */
      --shadow-xs: drop-shadow(0 1px 1.5px rgba(0, 0, 0, 0.05)) drop-shadow(2px 3px 3px rgba(0, 0, 0, 0.04)) drop-shadow(4px 7px 4px rgba(0, 0, 0, 0.02)) drop-shadow(8px 13px 5px rgba(0, 0, 0, 0.01));   /* shadow/xs: the floating panel */
      --shadow-lg: drop-shadow(3px 4px 15px rgba(0, 0, 0, 0.05)) drop-shadow(10px 16px 28.5px rgba(0, 0, 0, 0.04)) drop-shadow(23px 36px 39px rgba(0, 0, 0, 0.02)) drop-shadow(40px 64px 45px rgba(0, 0, 0, 0.01));
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; background: var(--surface-page); }
    body {
      margin: 0; height: 100vh; height: 100dvh;
      background: var(--surface-page); color: var(--text-primary);
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;   /* standard double-storey "a": no stylistic alternates */
      font-weight: 400; font-synthesis: none;
      font-size: var(--font-size-14); line-height: var(--line-height-20); letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }
    button, input, output { font: inherit; color: inherit; }

    /* ---------- squircle shapes ----------
       .sq elements get smoothed corners from effects.js, which writes the
       outline (--sq-outer), a 1px-smaller copy (--sq-inner) and a 2px-larger
       copy for the focus ring (--sq-ring) as clip paths.
       The element's own background is the border colour; ::before is the fill.
       Before the script runs, plain rounded corners stand in. */
    .sq {
      --r: var(--radius);
      --sq-line: var(--border-subtle);
      --sq-fill: var(--surface-page);
      position: relative; isolation: isolate; border: 0;
      background: var(--sq-line);
      clip-path: var(--sq-outer, inset(0 round var(--r)));
    }
    .sq::before {
      content: ""; position: absolute; inset: var(--stroke-sm); z-index: -1; pointer-events: none;
      background: var(--sq-fill);
      clip-path: var(--sq-inner, inset(0 round calc(var(--r) - var(--stroke-sm))));
    }
    /* focus: a 2px ring just outside the edge, following the squircle.
       The element's clip grows to the ring's outline, and ::after paints only
       the band between that and the element's own edge (--sq-band).
       Hex boxes show it for the keyboard or typing, not for a click on the swatch. */
    .sq:focus-visible, .input:has(:focus-visible) {
      outline: none;
      clip-path: var(--sq-ring, inset(calc(var(--focus-ring) * -1) round calc(var(--r) + var(--focus-ring))));
    }
    .sq:focus-visible::after, .input:has(:focus-visible)::after {
      content: ""; position: absolute; inset: calc(var(--focus-ring) * -1); pointer-events: none;
      background: var(--border-focus);
      clip-path: var(--sq-band, none);
    }

    /* rail | panel (only while open) | photo. The rail never moves; the photo takes what's left. */
    .app { display: grid; grid-template-columns: var(--rail-width) 1fr; grid-template-rows: 1fr; height: 100%; }
    .app.open { grid-template-columns: var(--rail-width) var(--panel-width) 1fr; }
    .rail { grid-column: 1; grid-row: 1; }
    .panel { grid-column: 2; grid-row: 1; }
    .stage { grid-column: -2 / -1; grid-row: 1; }

    /* ---------- icons: Foundations line icons, drawn in the text colour ---------- */
    .icon { display: block; width: var(--icon-md); height: var(--icon-md); flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .icon * { vector-effect: non-scaling-stroke; }   /* keeps the 1.5 line at 20px too, as in Figma */

    /* ---------- rail ---------- */
    .rail {
      display: flex; flex-direction: column; justify-content: space-between; align-items: center;
      min-height: 0; padding: var(--space-300) var(--space-150) var(--space-150);
    }
    .rail-top { display: flex; flex-direction: column; align-items: center; gap: var(--space-300); }
    .rail-sections { display: flex; flex-direction: column; gap: var(--space-100); }
    .rail-btn {
      --sq-line: transparent; --sq-fill: transparent;
      display: grid; place-items: center; width: var(--rail-button); height: var(--rail-button); padding: 0;
      color: var(--icon-primary); cursor: pointer;
    }
    @media (hover: hover) { .rail-btn:hover { --sq-line: var(--control-fill-hover); --sq-fill: var(--control-fill-hover); } }
    .rail-btn[aria-expanded="true"], .rail-btn[aria-expanded="true"]:hover { --sq-line: var(--surface-accent); --sq-fill: var(--surface-accent); color: var(--text-on-accent); }
    .rail-btn.outline { --sq-line: var(--border-subtle); --sq-fill: var(--surface-page); }   /* Choose photo starts the process */
    @media (hover: hover) { .rail-btn.outline:hover { --sq-fill: var(--control-fill-hover); } }
    .rail-btn:disabled, .rail-btn:disabled:hover { --sq-line: transparent; --sq-fill: transparent; color: var(--icon-disabled); cursor: default; }

    /* ---------- avatar: top of the rail ---------- */
    .avatar { display: block; width: var(--rail-button); height: var(--rail-button); border-radius: 50%; }
    .avatar-mobile { display: none; }
    .avatar img { display: block; width: var(--rail-button); height: var(--rail-button); }
    .avatar:focus-visible { outline: var(--focus-ring) solid var(--border-focus); outline-offset: 0; }

    /* ---------- panel: all four sections, scrolling on its own ---------- */
    /* desktop: the panel floats 8px in from the top and bottom, 16px squircle corners, a 1px outline, shadow/xs.
       It sits above the photo area, so its shadow falls across it rather than being covered. */
    .panel { position: relative; z-index: 1; isolation: isolate; display: flex; flex-direction: column; min-height: 0; margin: var(--space-100) 0; }
    /* the shadow sits on its own layer behind the panel: Safari drops a shadow
       from anything with a scrolling area inside */
    .panel::before {
      content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
      background: var(--surface-page); border-radius: var(--radius-lg);   /* hidden under the squircle; only its shadow shows */
      filter: var(--shadow-xs);
    }
    .panel[hidden] { display: none; }
    .panel-sheet {
      position: relative; isolation: isolate; display: flex; flex-direction: column; flex: 1; min-height: 0;
      padding: var(--stroke-sm);   /* contents sit inside the 1px outline, as in Figma */
      background: var(--border-subtle); clip-path: var(--sq-outer, inset(0 round var(--radius-lg)));
    }
    .panel-sheet::before {
      content: ""; position: absolute; inset: var(--stroke-sm); z-index: -1; pointer-events: none;
      background: var(--surface-page); clip-path: var(--sq-inner, inset(0 round calc(var(--radius-lg) - var(--stroke-sm))));
    }
    .grabber { display: none; }
    /* fixed header above the scrolling sections: close-panel button at the top right, 24 in */
    .panel-head { display: flex; justify-content: flex-end; flex: none; padding: var(--space-100) var(--space-100) 0; }   /* close-panel button 8 in */
    .panel-body, .dialog { color: var(--text-secondary); }   /* labels, hex codes, values, Format */
    .input input[type="text"] { color: inherit; }
    .panel-body { position: relative; flex: 1; overflow-y: auto; padding: 0 var(--space-300) var(--space-300); }
    .section + .section { margin-top: var(--space-500); }
    /* the Export heading takes focus when the dialog opens (so no button shows a ring); it isn't a control */
    #export-title:focus { outline: none; }
    .heading {
      display: flex; align-items: center; gap: var(--space-100); margin: 0 0 var(--space-300);
      color: var(--text-primary); font-size: var(--font-size-12); line-height: var(--line-height-18); font-weight: 600;
    }
    .heading .icon { width: var(--icon-sm); height: var(--icon-sm); }

    .field + .field { margin-top: var(--space-200); }
    .field-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-100); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-150); }
    .stack > * + * { margin-top: var(--space-200); }

    /* buttons: 46 tall, grey with an outline; .btn-action is the dark grey one. Labels: interface/body/sm/lg */
    .btn {
      --sq-line: var(--border-subtle); --sq-fill: var(--control-fill-on-panel);
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-100);
      height: var(--button-height); padding: 0 var(--space-200); cursor: pointer; white-space: nowrap;
      font-size: var(--font-size-14); line-height: var(--line-height-20); font-weight: 400;
    }
    @media (hover: hover) { .btn:hover { --sq-fill: var(--control-fill-hover); } }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .btn-action { --sq-line: var(--surface-action); --sq-fill: var(--surface-action); color: var(--text-on-action); }
    @media (hover: hover) { .btn-action:hover { --sq-line: var(--surface-action-hover); --sq-fill: var(--surface-action-hover); } }

    /* tabs (colour mode, format): plain text; the selected one sits on the yellow */
    .tabs { display: flex; gap: var(--space-50); }
    .tabs button {
      --sq-line: transparent; --sq-fill: transparent;
      width: var(--tab-width); height: var(--control-height); padding: 0 var(--space-150);
      cursor: pointer; color: var(--text-muted);
    }
    @media (hover: hover) { .tabs button:hover { color: var(--text-primary); } }
    .tabs button[aria-pressed="true"] { --sq-line: var(--surface-accent); --sq-fill: var(--surface-accent); color: var(--text-on-accent); }

    /* slider: a 16px grey bar filled to the value in near-black; the value reads out above it.
       Sliders running from -100 to 100 fill out from the centre (0). The real range input
       sits on top, invisible, for the mouse and keyboard; touch is handled by effects.js. */
    .bar {
      position: relative; display: block; height: var(--slider-bar);
      border-radius: var(--radius-full); background: var(--control-segment-track);
    }
    .bar-fill { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: var(--radius-full); background: var(--control-switch-track-on); }
    .bar input[type="range"] {
      -webkit-appearance: none; appearance: none; position: absolute; inset: 0; width: 100%; height: 100%;
      margin: 0; opacity: 0; cursor: pointer;
    }
    .bar input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 1px; height: var(--slider-bar); }
    .bar input[type="range"]::-moz-range-thumb { width: 1px; height: var(--slider-bar); border: 0; }
    .bar:has(input:focus-visible) { outline: var(--focus-ring) solid var(--border-focus); }
    .bar input[type="range"]:disabled { cursor: default; }
    .readout { font-variant-numeric: tabular-nums; }
    /* touch: a tap or an up-down swipe leaves the slider alone (the sheet scrolls);
       only a sideways drag moves it, from where it already is (effects.js) */
    @media (pointer: coarse) {
      .field:has(.bar) { touch-action: pan-y; }
      .bar input[type="range"] { pointer-events: none; }
    }

    /* colour presets: 8px squircle squares split into the preset's colours */
    .presets { display: flex; justify-content: space-between; }
    .preset {
      --sq-line: transparent;
      flex: none; width: var(--chip); height: var(--chip); padding: 0; cursor: pointer; transition: transform 0.12s ease;
    }
    .preset .chips { position: absolute; inset: 0; display: flex; }
    .preset .chips i { flex: 1; }
    @media (hover: hover) { .preset:hover { transform: scale(1.08); } }
    /* the black-and-white chip gets an outline so its white half doesn't vanish into the page */
    .preset:last-child { --sq-line: var(--border-subtle); }
    .preset:last-child .chips { inset: var(--stroke-sm); clip-path: var(--sq-inner, inset(0 round calc(var(--r) - var(--stroke-sm)))); }
    /* the preset in use: a 2px border/selected stroke (stroke/md) just outside the edge, drawn like the focus ring */
    .preset[aria-pressed="true"] { clip-path: var(--sq-ring, inset(calc(var(--focus-ring) * -1) round calc(var(--r) + var(--focus-ring)))); }
    .preset[aria-pressed="true"]::after {
      content: ""; position: absolute; inset: calc(var(--focus-ring) * -1); pointer-events: none;
      background: var(--border-selected); clip-path: var(--sq-band, none);
    }

    /* colour fields: label column as wide as "Highlights", then the swatch and hex box */
    .colour-fields[hidden] { display: none; }
    .colour-fields { display: grid; grid-template-columns: var(--label-column) max-content; align-items: center; column-gap: var(--space-150); row-gap: var(--space-100); }
    .colour-field { display: contents; }
    .colour-field[hidden] { display: none; }
    .input {
      --sq-fill: var(--control-fill-field);
      display: inline-flex; align-items: center; gap: var(--space-100);
      height: var(--control-height); padding: 0 var(--space-100) 0 var(--space-50);
    }
    .input input[type="text"] { width: 7ch; padding: 0; border: 0; background: none; outline: none; text-transform: uppercase; }
    input[type="color"] {
      --r: var(--radius-xs);
      width: var(--swatch); height: var(--swatch); padding: 0; border: 0; background: none; cursor: pointer; flex: none;
      clip-path: var(--sq-outer, inset(0 round var(--radius-xs)));
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 0; }
    input[type="color"]::-moz-color-swatch { border: 0; border-radius: 0; }
    .colours[data-off="true"] { opacity: 0.4; pointer-events: none; }
    #quality-field[data-off="true"] { opacity: 0.4; pointer-events: none; }   /* PNG has no quality setting */

    /* ---------- stage ---------- */
    .stage {
      position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--surface-page);
      display: grid; place-items: center; padding: var(--space-500);   /* photo centred in the space left over */
    }
    /* starting screen: "Choose photo" over a second +, centred as one block in the free space.
       Panel closed: centred in the window (half the rail's width left of the photo area's centre). */
    /* rail tooltips (desktop only): dark grey label 16px right of the button, centred on it.
       The wrapper carries the shadow, so the squircle clip doesn't cut it off. */
    .tooltip {
      position: fixed; z-index: 10; pointer-events: none; filter: var(--shadow-sm);
      opacity: 0; transform: translateY(-50%);   /* fades in and out; never scales */
      transition: opacity 125ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    .tooltip[hidden] { display: none; }
    .tooltip.on { opacity: 1; pointer-events: auto; }   /* the pointer can rest on it without it vanishing */
    .tooltip.instant { transition: none; }
    .tooltip-box {
      --sq-line: var(--surface-action); --sq-fill: var(--surface-action);   /* radius/sm (8px), the .sq default */
      display: block; padding: var(--space-50) var(--space-150); white-space: nowrap;
      color: var(--text-on-action); font-size: var(--font-size-12); line-height: var(--line-height-18); font-weight: 400;   /* interface/body/xs/lg */
    }

    .start { display: flex; flex-direction: column; align-items: center; gap: var(--space-200); }
    .app:not(.open) .start { transform: translateX(calc(var(--rail-width) / -2)); }
    .start-title {
      margin: 0; color: var(--text-primary); text-align: center;
      font-family: var(--font-family-exposure); font-weight: var(--font-weight-exposure);
      font-size: var(--font-size-32); line-height: var(--line-height-34); letter-spacing: var(--letter-spacing-heading);
    }
    #preview:not([hidden]) ~ .start { display: none; }
    .stage.drop { box-shadow: inset 0 0 0 2px var(--drop-outline); }   /* photos can still be dropped or pasted here */
    /* Export dialog: centred over the photo area. The wrapper carries the
       shadow, since the squircle clip would cut a shadow off the dialog itself. */
    /* It's the browser's own <dialog>, so it sits above everything; it's placed
       in the middle of the photo area (beside the rail, or beside the panel when open). */
    .app { --stage-left: var(--rail-width); }
    .app.open { --stage-left: calc(var(--rail-width) + var(--panel-width)); }
    .dialog-wrap {
      position: fixed; inset: auto; margin: 0; padding: 0; border: 0; background: none; color: inherit; overflow: visible;
      left: calc(var(--stage-left) + (100% - var(--stage-left)) / 2); top: 50%; transform: translate(-50%, -50%);
      width: var(--dialog-width); max-width: calc(100% - var(--stage-left) - var(--space-300) * 2); max-height: none;
      filter: var(--shadow-lg);
    }
    .dialog-wrap:not([open]) { display: none; }
    .dialog-wrap::backdrop { background: transparent; }   /* the browser's own dimming is off: the photo area's overlay below is the design */
    /* overlay: dims the photo area (not the rail or the panel) while Export is open */
    .stage:has(.dialog-wrap[open])::before { content: ""; position: absolute; inset: 0; z-index: 1; background: var(--surface-scrim); }
    .dialog { --r: var(--radius-lg); display: flex; flex-direction: column; padding: calc(var(--space-300) + var(--stroke-sm)); }   /* 24 inside the 1px outline, as in Figma */
    .dialog .btn { width: 100%; margin-top: var(--space-300); }

    #preview { display: block; max-width: 100%; max-height: 100%; user-select: none; -webkit-user-select: none; }   /* never larger than its space, even before effects.js sizes it */
    #preview[hidden] { display: none; }
    .status { position: absolute; left: 0; right: 0; bottom: var(--space-200); text-align: center; color: var(--text-muted); font-size: var(--font-size-12); line-height: var(--line-height-18); }

    /* ---------- mobile, below 1024: bottom bar, sheets, avatar over the photo ---------- */
    @media (max-width: 1023px) {
      :root { --slider-bar: var(--space-200); }   /* slider bars: 16 tall on phones (Figma Size=Small) */
      .app { display: block; }
      /* the page itself never scrolls or bounces: everything is fixed in place */
      html, body { overflow: hidden; overscroll-behavior: none; }

      /* the rail becomes a bar along the bottom: same buttons, same order, spread evenly */
      .rail {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
        flex-direction: row; justify-content: space-between;
        padding: var(--space-150) var(--space-300) calc(var(--space-150) + env(safe-area-inset-bottom));   /* 24 at the sides */
        border-right: 0; border-top: var(--stroke-sm) solid var(--border-subtle);
        background: var(--surface-page);
      }
      .rail-top, .rail-sections { display: contents; }
      .rail .avatar { display: none; }
      .start { gap: var(--space-150); }
      .app:not(.open) .start { transform: none; }
      .start-title { font-size: var(--font-size-24); line-height: var(--line-height-26); }
      .avatar-mobile { display: block; position: fixed; top: var(--space-200); left: var(--space-200); z-index: 1; }

      /* the photo fills the space above the bar, clear of the avatar */
      .stage {
        position: fixed; left: 0; right: 0; top: 0; bottom: calc(var(--bar-height) + env(safe-area-inset-bottom));
        padding: var(--header-height) var(--space-200) var(--space-200);   /* 16 clear of the bar or sheet */
        touch-action: none;   /* dragging on the photo doesn't move the page */
      }
      .status.size { display: none; }   /* no photo size on phones, as in Figma */
      /* with a sheet up, the photo centres between the avatar and the sheet */
      body:has(.panel:not([hidden]):not([data-closing])) .stage,
      body:has(.dialog-wrap[open]:not([data-closing])) .stage { bottom: calc(var(--bar-height) + env(safe-area-inset-bottom) + var(--space-150) + var(--sheet-height)); }

      /* menus: float 12 in from the sides and 12 above the bar, 16px squircle, 1px outline, shadow/sm.
         They fade in while rising a few pixels (effects.js). The grabber keeps its space but isn't shown. */
      .panel, .dialog-wrap {
        position: fixed; left: var(--space-150); right: var(--space-150); top: auto; bottom: calc(var(--bar-height) + env(safe-area-inset-bottom) + var(--space-150)); z-index: 2;
        width: auto; max-width: none; transform: none; margin: 0;
        touch-action: pan-y;
      }
      /* the shadow sits on its own layer behind the sheet: iPhone Safari drops a shadow
         from anything with a scrolling area inside, like Colour in Tritone */
      .panel::before, .dialog-wrap::before {
        content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
        background: var(--surface-page); clip-path: none;
        border-radius: var(--radius-lg);   /* hidden under the squircle menu; only its shadow shows */
        filter: var(--shadow-sm);
      }
      /* one section per icon, in a sheet of one fixed height; Colour in Tritone scrolls inside it */
      .panel { height: var(--sheet-height); max-height: calc(100% - var(--bar-height) - env(safe-area-inset-bottom) - var(--space-150) - var(--header-height)); }
      .panel .section, .panel .section + .section { display: none; margin-top: 0; }
      .panel[data-section="colour"] #sec-colour,
      .panel[data-section="adjust"] #sec-adjust,
      .panel[data-section="effects"] #sec-effects,
      .panel[data-section="texture"] #sec-texture { display: block; }
      .panel-sheet { padding: 0; }
      .panel-sheet, .dialog { --r: var(--radius-lg); padding-top: var(--space-100); }
      .panel-head { display: none; }   /* phones close the sheet by its icon or a swipe */
      .grabber {
        display: block; visibility: hidden; flex: none; width: var(--grabber-width); height: var(--grabber-height); margin: 0 auto;
        border-radius: calc(var(--grabber-height) / 2); background: var(--control-fill-open);
      }
      .panel[data-closing], .dialog-wrap[data-closing] { pointer-events: none; }   /* sliding away: taps go through (effects.js slides the sheets) */
      .stage:has(.dialog-wrap[open])::before { content: none; }   /* no overlay behind the phone sheet */

      /* spacing steps down: 16 padding, 24 between sections, 16 heading to controls, 12 between controls */
      .panel-body { padding: var(--space-200); }
      .section + .section { margin-top: var(--space-300); }
      .heading { margin-bottom: var(--space-200); }
      .field + .field, .stack > * + * { margin-top: var(--space-150); }

      /* the Export sheet: same content as the desktop dialog, as tall as the section sheets */
      .dialog { padding: var(--space-100) var(--space-200) var(--space-200); }
      .dialog { height: var(--sheet-height); }   /* same height as the section sheets */
      .dialog .grabber { margin-bottom: var(--space-200); }
      .dialog #quality-field { margin-bottom: var(--space-200); }
      .dialog .btn { margin-top: auto; }   /* Download sits at the bottom of the sheet */

      /* type steps down to the sm styles; tabs sit edge to edge */
      .tabs { gap: 0; }
      .tabs button { font-size: var(--font-size-12); line-height: var(--line-height-18); }
    }
  </style>
</head>
<body>
  <!-- Foundations icons (24px, 1.5 line), drawn in currentColor -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.75V18.25"/><path d="M18.25 12H5.75"/></symbol>
    <symbol id="i-colour" viewBox="0 0 24 24"><path d="M9.5 16C9.5 16.2761 9.27614 16.5 9 16.5C8.72386 16.5 8.5 16.2761 8.5 16C8.5 15.7239 8.72386 15.5 9 15.5C9.27614 15.5 9.5 15.7239 9.5 16Z"/><path d="M6.75 19.25H11.25C12.3546 19.25 13.25 18.3546 13.25 17.25V6.75C13.25 5.64543 12.3546 4.75 11.25 4.75H6.75C5.64543 4.75 4.75 5.64543 4.75 6.75V17.25C4.75 18.3546 5.64543 19.25 6.75 19.25Z"/><path d="M15.75 15.25L18.6801 12.2582C19.4306 11.4917 19.4429 10.2697 18.7078 9.48834L15.6279 6.21458C14.873 5.41215 13.1903 5.79959 13.1903 5.79959"/></symbol>
    <symbol id="i-adjust" viewBox="0 0 24 24"><path d="M4.75 8H7.25"/><path d="M12.75 8H19.25"/><path d="M4.75 16H12.25"/><path d="M17.75 16H19.25"/><path d="M12.25 8C12.25 9.24264 11.2426 10.25 10 10.25C8.75736 10.25 7.75 9.24264 7.75 8C7.75 6.75736 8.75736 5.75 10 5.75C11.2426 5.75 12.25 6.75736 12.25 8Z"/><path d="M17.25 16C17.25 17.2426 16.2426 18.25 15 18.25C13.7574 18.25 12.75 17.2426 12.75 16C12.75 14.7574 13.7574 13.75 15 13.75C16.2426 13.75 17.25 14.7574 17.25 16Z"/></symbol>

    <symbol id="i-texture" viewBox="0 0 24 24"><path d="M13.25 18.25H5.75M13.25 18.25V5.75M13.25 18.25H14.25M5.75 18.25V5.75M5.75 18.25H4.75M5.75 5.75H13.25M5.75 5.75H4.75M13.25 5.75H14.25M15.75 7.75H18.25C18.8023 7.75 19.25 8.19772 19.25 8.75V11L17.25 12.25V15.25C17.25 15.8023 16.8023 16.25 16.25 16.25H15.75"/></symbol>

    <symbol id="i-download" viewBox="0 0 24 24"><path d="M4.75 14.75V16.25C4.75 17.9069 6.09315 19.25 7.75 19.25H16.25C17.9069 19.25 19.25 17.9069 19.25 16.25V14.75"/><path d="M12 14.25V4.75"/><path d="M8.75 10.75L12 14.25L15.25 10.75"/></symbol>
  </svg>

  <div class="tooltip" id="tooltip" aria-hidden="true" hidden><span class="tooltip-box sq"></span></div>

  <div class="app">
    <!-- small screens: avatar top-left, over the photo area -->
    <a class="avatar avatar-mobile" href="/" aria-label="Craig Hooper, home"><img src="/assets/avatar.png" alt="" width="40" height="40" /></a>

    <!-- the rail: these buttons never appear, hide or move -->
    <nav class="rail" aria-label="Tools">
      <div class="rail-top">
        <a class="avatar" href="/" aria-label="Craig Hooper, home"><img src="/assets/avatar.png" alt="" width="40" height="40" /></a>
        <div class="rail-sections">
          <button type="button" class="rail-btn outline sq" id="choose" aria-label="Choose photo"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
          <button type="button" class="rail-btn sq" data-section="colour" aria-controls="panel" aria-label="Colour"><svg class="icon" aria-hidden="true"><use href="#i-colour"/></svg></button>
          <button type="button" class="rail-btn sq" data-section="adjust" aria-controls="panel" aria-label="Adjust"><svg class="icon" aria-hidden="true"><use href="#i-adjust"/></svg></button>
          <button type="button" class="rail-btn sq" data-section="effects" aria-controls="panel" aria-label="Effects"><svg class="icon" aria-hidden="true"><use href="#i-effects"/></svg></button>
          <button type="button" class="rail-btn sq" data-section="texture" aria-controls="panel" aria-label="Texture"><svg class="icon" aria-hidden="true"><use href="#i-texture"/></svg></button>
        </div>
      </div>
      <button type="button" class="rail-btn sq" id="download" aria-label="Download" aria-haspopup="dialog" aria-controls="export-dialog" disabled><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg></button>
    </nav>

    <aside class="panel" id="panel" aria-label="Controls" hidden>
      <div class="panel-sheet sq-sheet">
      <div class="grabber" aria-hidden="true"></div>
      <div class="panel-head">
        <button type="button" class="rail-btn sq" id="close-panel" aria-label="Close panel" title="Close panel"><svg class="icon" aria-hidden="true"><use href="#i-sidebar"/></svg></button>
      </div>
      <div class="panel-body" id="panel-body">
        <section class="section stack" id="sec-colour">
          <h2 class="heading"><svg class="icon" aria-hidden="true"><use href="#i-colour"/></svg>Colour</h2>
          <div class="tabs" id="mode">
            <button type="button" class="sq" data-value="original">Original</button>
            <button type="button" class="sq" data-value="duo">Duotone</button>
            <button type="button" class="sq" data-value="tri">Tritone</button>
          </div>
          <div class="colours stack" id="colours">
            <div class="presets" id="presets"></div>
            <div class="colour-fields" hidden>   <!-- hidden for now (Craig, 9 November); presets set the colours -->
              <label class="colour-field">
                <span>Shadows</span>
                <span class="input sq"><input type="color" id="c-dark" aria-label="Shadow colour" /><input type="text" class="mono" id="c-dark-hex" maxlength="7" aria-label="Shadow colour hex" /></span>
              </label>
              <label class="colour-field" id="mid-row">
                <span>Midtones</span>
                <span class="input sq"><input type="color" id="c-mid" aria-label="Midtone colour" /><input type="text" class="mono" id="c-mid-hex" maxlength="7" aria-label="Midtone colour hex" /></span>
              </label>
              <label class="colour-field">
                <span>Highlights</span>
                <span class="input sq"><input type="color" id="c-light" aria-label="Highlight colour" /><input type="text" class="mono" id="c-light-hex" maxlength="7" aria-label="Highlight colour hex" /></span>
              </label>
            </div>
            <div class="field">
              <div class="field-head"><label for="amount">Strength</label><output class="readout" id="amount-value" for="amount"></output></div>
              <span class="bar"><span class="bar-fill"></span><input type="range" id="amount" min="0" max="100" /></span>
            </div>
          </div>
        </section>

        <section class="section" id="sec-adjust">
          <h2 class="heading"><svg class="icon" aria-hidden="true"><use href="#i-adjust"/></svg>Adjust</h2>
          <div class="field">
            <div class="field-head"><label for="brightness">Brightness</label><output class="readout" id="brightness-value" for="brightness"></output></div>
            <span class="bar"><span class="bar-fill"></span><input type="range" id="brightness" min="-100" max="100" /></span>
          </div>
          <div class="field">
            <div class="field-head"><label for="contrast">Contrast</label><output class="readout" id="contrast-value" for="contrast"></output></div>
            <span class="bar"><span class="bar-fill"></span><input type="range" id="contrast" min="-100" max="100" /></span>
          </div>
          <div class="field">
            <div class="field-head"><label for="midtones">Midtones</label><output class="readout" id="midtones-value" for="midtones"></output></div>
            <span class="bar"><span class="bar-fill"></span><input type="range" id="midtones" min="-100" max="100" /></span>
          </div>
        </section>

        <section class="section" id="sec-effects">
          <h2 class="heading"><svg class="icon" aria-hidden="true"><use href="#i-effects"/></svg>Effects</h2>
          <div class="field">
            <div class="field-head"><label for="misregister">Misregistration</label><output class="readout" id="misregister-value" for="misregister"></output></div>
            <span class="bar"><span class="bar-fill"></span><input type="range" id="misregister" min="0" max="100" /></span>
          </div>
          <div class="field">
            <div class="field-head"><label for="vignette">Vignette</label><output class="readout" id="vignette-value" for="vignette"></output></div>
            <span class="bar"><span class="bar-fill"></span><input type="range" id="vignette" min="0" max="100" /></span>
          </div>
        </section>

        <section class="section" id="sec-texture">
          <h2 class="heading"><svg class="icon" aria-hidden="true"><use href="#i-texture"/></svg>Texture</h2>
          <div class="field">
            <div class="field-head"><label for="grain">Grain</label><output class="readout" id="grain-value" for="grain"></output></div>
            <span class="bar"><span class="bar-fill"></span><input type="range" id="grain" min="0" max="100" /></span>
          </div>
          <div class="field">
            <div class="field-head"><label for="grainSize">Grain size</label><output class="readout" id="grainSize-value" for="grainSize"></output></div>
            <span class="bar"><span class="bar-fill"></span><input type="range" id="grainSize" min="1" max="6" /></span>
          </div>
          <div class="field">
            <div class="field-head"><label for="speckle">Speckle</label><output class="readout" id="speckle-value" for="speckle"></output></div>
            <span class="bar"><span class="bar-fill"></span><input type="range" id="speckle" min="0" max="100" /></span>
          </div>
        </section>
      </div>
      </div>
    </aside>

    <main class="stage" id="stage">
      <canvas id="preview" hidden aria-label="Edited photo"></canvas>
      <!-- starting screen: a second Choose photo in the middle, gone once a photo is showing -->
      <div class="start">
        <h1 class="start-title">Choose photo</h1>
        <button type="button" class="rail-btn outline sq" id="choose-start" aria-label="Choose photo" title="Choose photo"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
      </div>
      <div class="status mono" id="status" role="status"></div>

      <!-- Export dialog, centred over the photo: the browser's own dialog, so focus stays inside
           while it's open. Esc, the phone's back gesture or a click outside closes it. -->
      <dialog class="dialog-wrap" id="export-dialog" aria-labelledby="export-title">
        <div class="dialog sq">
          <div class="grabber" aria-hidden="true"></div>
          <h2 class="heading" id="export-title" tabindex="-1" autofocus><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>Export</h2>
          <div class="field row">
            <span>Format</span>
            <div class="tabs" id="format">
              <button type="button" class="sq" data-value="jpg">JPG</button>
              <button type="button" class="sq" data-value="png">PNG</button>
            </div>
          </div>
          <div class="field" id="quality-field">
            <div class="field-head"><label for="quality">JPG quality</label><output class="readout" id="quality-value" for="quality"></output></div>
            <span class="bar"><span class="bar-fill"></span><input type="range" id="quality" min="40" max="100" /></span>
          </div>
          <button type="button" class="btn btn-action sq" id="export-download">Download</button>
        </div>
      </dialog>
    </main>
  </div>
  <input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,image/*" hidden />
  <script src="effects.js?v=64"></script>
</body>
</html>
